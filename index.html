<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
background:#0a0a0a;
color:white;
font-family:'Inter', sans-serif;
}

/* NAV */
nav{
position:absolute;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
z-index:1000;
background:linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
}

/* SOCIAL ICONS */
.social-icons{
position:absolute;
left:8%;
top:50%;
transform:translateY(-50%);
display:flex;
gap:14px;
z-index:1001;
}

.social-icons a{
color:#ccc;
font-size:0.95rem;
transition:0.3s;
}

.social-icons a:hover{
color:white;
transform:translateY(-2px);
text-shadow:0 0 8px rgba(194,0,255,0.6);
}

nav video{
height:70px;
margin-left:80px; /* prevents overlap */
}

.nav-links{
display:flex;
align-items:center;
gap:30px;
}

/* HAMBURGER */
.menu-toggle{
display:none;
font-size:1.6rem;
cursor:pointer;
color:white;
}

/* NAV LINKS */
nav a{
text-decoration:none;
color:#eee;
font-size:0.9rem;
font-weight:500;
padding:6px 10px;
position:relative;
transition:0.3s;
}

nav a::after{
content:'';
position:absolute;
left:0;
bottom:-3px;
width:0%;
height:1.5px;
background:linear-gradient(90deg,#9b59b6,#e91e63);
transition:0.35s;
}

nav a:hover::after{width:100%;}

nav a:hover{
color:white;
text-shadow:0 0 6px rgba(194,0,255,0.5);
}

/* DROPDOWN */
.dropdown{position:relative;}

.dropdown-content{
display:none;
position:absolute;
top:35px;
background:#111;
min-width:220px;
border:1px solid #222;
flex-direction:column;
border-radius:6px;
}

.dropdown:hover .dropdown-content{display:flex;}

.cart-icon{cursor:pointer;}

#cart-count{
background:white;
color:black;
font-size:12px;
padding:3px 7px;
border-radius:50%;
margin-left:5px;
}

/* HERO */
.hero{
position:relative;
height:65vh;
overflow:hidden;
}

.hero video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
}

.hero-content{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:0 8%;
}

.hero-content h1{
font-family:'Playfair Display', serif;
font-size:3.5rem;
}

/* COLLECTIONS */
.collections{
padding:60px 8%;
text-align:center;
}

.collections h2{
font-family:'Playfair Display', serif;
font-size:2.5rem;
margin-bottom:40px;
}

.collection-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

/* FADE */
.fade-title{
opacity:0;
transform:translateY(20px);
transition:0.8s;
}

.fade-title.visible{
opacity:1;
transform:translateY(0);
}

/* MOBILE */
@media(max-width:900px){

.social-icons{
left:20px;
top:20px;
transform:none;
}

nav video{
margin-left:0;
}

.menu-toggle{display:block;}

.nav-links{
display:none;
flex-direction:column;
background:#0a0a0a;
position:absolute;
top:100%;
width:100%;
}

.nav-links.active{display:flex;}

}

</style>
</head>

<body>

<!-- NAV -->
<nav>

<!-- SOCIAL ICONS -->
<div class="social-icons">
<a href="https://www.instagram.com/spotfutwearseu/" target="_blank"><i class="fab fa-instagram"></i></a>
<a href="https://www.facebook.com/profile.php?id=61587799692085" target="_blank"><i class="fab fa-facebook-f"></i></a>
<a href="https://www.tiktok.com/@spotfutwearseu" target="_blank"><i class="fab fa-tiktok"></i></a>
<a href="https://wa.me/34643779896" target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>

<video autoplay muted loop playsinline></video>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="nav-links">
<a href="#collections">Signature</a>
<a href="#shop">Shop</a>
<a href="#philosophy">About</a>
</div>

</nav>

<!-- HERO -->
<section class="hero">
<video autoplay muted loop playsinline>
<source src="banner.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="hero-content">
<h1>Engineered Precision.<br>Elevated Identity.</h1>
</div>
</section>

<!-- SIGNATURE COLLECTION -->
<section id="collections" class="collections">
<h2 id="signature-title"></h2>

<div class="collection-grid">
<img src="SignatureKits/SF-SJF-S002_1.jpg">
<img src="UrbanHoodies/SF-UHF-S001_1.png">
<img src="VarsityBomber/varsity-CK-Model.png">
</div>

</section>

<!-- SHOP -->
<section id="shop" class="collections">
<h2 id="shop-title" class="fade-title">Shop by Category</h2>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

const signatureTitle = document.getElementById("signature-title");
const shopTitle = document.getElementById("shop-title");

let typed = false;

function typeWriter(el, text){
let i=0;
function t(){
if(i<text.length){
el.innerHTML+=text[i++];
setTimeout(t,45);
}
}
t();
}

const observer = new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){

if(entry.target.id==="signature-title" && !typed){
typed=true;
typeWriter(signatureTitle,"Signature Collection");
}

if(entry.target.id==="shop-title"){
setTimeout(()=>shopTitle.classList.add("visible"),200);
}

}
});
},{threshold:0.4});

observer.observe(signatureTitle);
observer.observe(shopTitle);

});
</script>

</body>
</html>
