<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
}

/* HERO SECTION */
.hero {
    height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero video {
    position: absolute;
    width: 100%;
    height: 60vh;
    object-fit: cover;
    z-index: -1;
    opacity: 0.5;
}

/* GLASS CARD */
.glass {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 20px 30px;
    border: 1px solid rgba(255,255,255,0.2);
}

/* BUTTON */
.btn {
    margin-top: 15px;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, #ff00cc, #3333ff);
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.btn:hover {
    box-shadow: 0 0 15px rgba(255,0,200,0.8),
                0 0 30px rgba(51,51,255,0.6);
    transform: translateY(-2px);
}

/* SECTION */
.section {
    padding: 50px 20px;
    text-align: center;
}

.cards {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    width: 250px;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <video autoplay muted loop>
        <source src="your-video.mp4" type="video/mp4">
    </video>

    <div class="glass">
        <h1>SPOTFUT</h1>
        <p>Where Style Meets Football</p>
        <a href="#shop" class="btn">Shop Now</a>
    </div>
</section>

<!-- SIGNATURE COLLECTION -->
<section class="section" id="signature">
    <h2>Signature Collection</h2>

    <div class="cards">
        <div class="glass card">
            <h3>Bomber Jacket</h3>
        </div>
        <div class="glass card">
            <h3>Tracksuit</h3>
        </div>
    </div>

    <a href="#signature" class="btn">Explore Collection</a>
</section>

<!-- SHOP -->
<section class="section" id="shop">
    <h2>Shop by Categories</h2>

    <div class="cards">
        <div class="glass card">
            <h3>Football Kits</h3>
        </div>
        <div class="glass card">
            <h3>Streetwear</h3>
        </div>
    </div>
</section>

</body>
</html>
