<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  padding:20px 8%;
  border-bottom:1px solid #1e1e1e;
}

.logo,.cart{cursor:pointer}

/* NAV */
.nav{
  display:flex;
  gap:22px;
  padding:15px 8%;
  border-bottom:1px solid #1e1e1e;
  position:relative;
}

.nav-item{
  position:relative;
  cursor:pointer;
  padding:10px 8px;
}

.nav-item:hover{color:#c200ff}

.nav-item::after{
  content:'';
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  height:20px;
}

/* DROPDOWN FIX */
.dropdown{
  position:absolute;
  top:100%;
  left:0;
  margin-top:10px;
  background:#111;
  border:1px solid #222;
  min-width:200px;

  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:0.25s ease;
}

.nav-item:hover .dropdown,
.dropdown:hover{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.dropdown a{
  display:block;
  padding:10px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#1a1a1a;
  color:#c200ff;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:20px 8%;
}

.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goBack()">← BACK</div>
  <div class="cart" onclick="goCart()">🛒</div>
</header>

<!-- NAV -->
<div class="nav">

  <div class="nav-item">All</div>

  <div class="nav-item">
    Football ▾
    <div class="dropdown">
      <a href="product.html?sport=football&type=kits">Kits</a>
      <a href="product.html?sport=football&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=football&type=hoodies">Hoodies</a>
      <a href="product.html?sport=football&type=jackets">Jackets</a>
    </div>
  </div>

</div>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const sport = params.get("sport");
const type = params.get("type");

const key = sport && type ? `${sport}_${type}` : null;

function render(){

  let items = PRODUCTS[key] || [];

  document.getElementById("grid").innerHTML = items.map(p=>`
    <div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>

      <select>
        <option>Select Size</option>
        <option>S</option><option>M</option><option>L</option><option>XL</option>
      </select>

      <button onclick="add('${p.id}',this)">Add</button>
    </div>
  `).join("");
}

function add(id,btn){
  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  cart.push({id});
  localStorage.setItem("cart",JSON.stringify(cart));
}

function goBack(){
  window.location.href="men.html";
}

function goCart(){
  window.location.href="cart.html";
}

render();

</script>

</body>
</html>
