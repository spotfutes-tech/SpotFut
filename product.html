<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:18px 8%;
  border-bottom:1px solid #1e1e1e;
}

.back,.cart{cursor:pointer}

/* TITLE */
.title{
  text-align:center;
  padding:25px;
  font-size:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:20px 8%;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

/* ================= SLIDER FIX ================= */
.slider{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.slider img{
  width:100%;
  height:100%;
  object-fit:contain;   /* FIX: prevents cropping */
  background:#000;
}

/* arrows */
.slider button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  border:none;
  color:white;
  font-size:22px;
  width:30px;
  height:40px;
  cursor:pointer;
}

.slider .prev{ left:0; }
.slider .next{ right:0; }

/* SELECT */
select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
  border:1px solid #333;
}

/* BUTTON */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="back" onclick="goBack()">← Back</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</div>

<div class="title" id="title">Products</div>

<div class="grid" id="grid"></div>

<script src="product.js"></script>

<script>
window.onerror = function(msg, url, line, col, error){
  console.log("JS ERROR:", msg);
  console.log("Line:", line);
};
  
const cat = new URLSearchParams(window.location.search).get("cat");

/* ================= GET PRODUCTS ================= */
function getItems() {
    // If no category in URL, show everything in PRODUCTS
    if (!cat) {
        return Object.keys(PRODUCTS).map(id => ({
            id,
            ...PRODUCTS[id]
        }));
    }

    // If category doesn't exist in mapping
    if (!CATEGORIES[cat]) return [];

    // Map the IDs in the category to the actual product data
    return CATEGORIES[cat].map(id => {
        if (PRODUCTS[id]) {
            return { id, ...PRODUCTS[id] };
        }
        return null; 
    }).filter(item => item !== null); // Remove any nulls to prevent crashes
}

/* ================= SLIDER STATE ================= */
const imgIndex = {};

/* ================= RENDER ================= */
function render() {
    const items = getItems();
    const grid = document.getElementById("grid");
    const titleEl = document.getElementById("title");

    titleEl.innerText = cat ? cat.replace(/_/g, " ").toUpperCase() : "ALL PRODUCTS";

    if (items.length === 0) {
        grid.innerHTML = "<p style='text-align:center; width:100%;'>No products found in this category.</p>";
        return;
    }

    let html = "";
    for (let p of items) {
        let images = p.img ? (Array.isArray(p.img) ? p.img : [p.img]) : ["https://via.placeholder.com/300x400?text=No+Image"];

        html += `
        <div class="card">
            <div class="slider">
                <button class="prev" onclick="changeImg('${p.id}', -1)">‹</button>
                <img id="img-${p.id}" src="${images[0]}" alt="${p.name}">
                <button class="next" onclick="changeImg('${p.id}', 1)">›</button>
            </div>
            <h3>${p.name}</h3>
            <p style="color: #6a00ff; font-weight: bold; margin: 5px 0;">$${p.price}</p>
            <select id="size-${p.id}">
                <option value="">Select Size</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>
            <button onclick="add('${p.id}')">Add to Cart</button>
        </div>`;
    }
    grid.innerHTML = html;
}
/* ================= SLIDER ================= */
function changeImg(id, dir){

  const items = getItems();
  const product = items.find(p => p.id === id);

  if(!product || !product.img) return;

  const images = Array.isArray(product.img)
    ? product.img
    : [product.img];

  if(!imgIndex[id]) imgIndex[id] = 0;

  imgIndex[id] += dir;

  if(imgIndex[id] < 0) imgIndex[id] = images.length - 1;
  if(imgIndex[id] >= images.length) imgIndex[id] = 0;

  const el = document.getElementById(`img-${id}`);
  if(el){
    el.src = images[imgIndex[id]];
  }
}

/* ================= CART ================= */
function add(id) {
    const sizeSelect = document.getElementById(`size-${id}`);
    const size = sizeSelect.value;

    if (!size) {
        alert("Please select a size");
        return;
    }

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({ id, size, price: PRODUCTS[id].price, name: PRODUCTS[id].name });

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCart();
    alert("Added to cart!");
}
function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("count").innerText = cart.length;
}

function goBack(){
  window.history.back();
}

function goCart(){
  window.location.href="../cart.html";
}

/* INIT */
render();
updateCart();

</script>

</body>
</html>
