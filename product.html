<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:18px 8%;
  border-bottom:1px solid #1e1e1e;
}

.back{cursor:pointer}
.cart{cursor:pointer}

/* TITLE */
.title{
  text-align:center;
  padding:25px;
  font-size:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:20px 8%;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  background:#000;
}

/* SELECT */
select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
  border:1px solid #333;
}

/* BUTTON */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

/* NAV FIX (NO BREAK HOVER) */
.nav{
  display:flex;
  gap:22px;
  padding:15px 8%;
  border-bottom:1px solid #1e1e1e;
}

.nav-item{
  position:relative;
  cursor:pointer;
  padding:8px;
}

.nav-item:hover{
  color:#c200ff;
}

.nav-item::after{
  content:'';
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  height:25px;
}

/* DROPDOWN */
.dropdown{
  position:absolute;
  top:100%;
  left:0;
  background:#111;
  border:1px solid #222;
  min-width:200px;

  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:0.25s;
}

.nav-item:hover .dropdown,
.dropdown:hover{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.dropdown a{
  display:block;
  padding:10px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#1a1a1a;
  color:#c200ff;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="back" onclick="goBack()">← Back</div>
  <div class="cart">🛒 <span id="count">0</span></div>
</div>

<div class="title" id="title">Products</div>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

const cat = new URLSearchParams(location.search).get("cat");

function render(){

  const items = getProductsByCategory(cat);

  document.getElementById("title").innerText =
    cat ? cat.replaceAll("_"," ").toUpperCase() : "ALL PRODUCTS";

  document.getElementById("grid").innerHTML = items.map(p => `
    <div class="card">
      <img src="${p.img || ''}">
      <h3>${p.name}</h3>

      <select>
        <option>Select Size</option>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <button onclick="add('${p.id}', this)">Add</button>
    </div>
  `).join("");
}

function add(id, btn){

  let card = btn.closest(".card");
  let size = card.querySelector("select").value;

  if(size === "Select Size") return alert("Select size");

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({id, size});

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCart();
}

function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("count").innerText = cart.length;
}

function goBack(){
  window.location.href="../Men/men.html";
}

render();
updateCart();

</script>

</body>
</html>
