<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:18px 8%;
  border-bottom:1px solid #1e1e1e;
}

.back,.cart{cursor:pointer}

/* TITLE */
.title{
  text-align:center;
  padding:25px;
  font-size:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:20px 8%;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

/* CLICKABLE */
.clickable{
  cursor:pointer;
}

/* SLIDER */
.slider{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.slider img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* arrows */
.slider button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  border:none;
  color:white;
  font-size:22px;
  width:30px;
  height:40px;
  cursor:pointer;
  z-index:2;
}

.slider .prev{ left:0; }
.slider .next{ right:0; }

/* SELECT */
select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
  border:1px solid #333;
}

/* BUTTON */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="back" onclick="goBack()">← Back</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</div>

<div class="title" id="title">Products</div>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

window.onerror = function(msg, url, line){
  console.log("JS ERROR:", msg, "Line:", line);
};

const cat = new URLSearchParams(window.location.search).get("cat");

/* ================= GET PRODUCTS ================= */
function getItems() {
    if (!cat) {
        return Object.keys(PRODUCTS).map(id => ({
            id,
            ...PRODUCTS[id]
        }));
    }

    if (!CATEGORIES[cat]) return [];

    return CATEGORIES[cat].map(id => {
        if (PRODUCTS[id]) {
            return { id, ...PRODUCTS[id] };
        }
        return null;
    }).filter(Boolean);
}

/* ================= GO DETAIL ================= */
function goToProduct(id){
    window.location.href = `product-detail.html?id=${id}`;
}

/* ================= SLIDER STATE ================= */
const imgIndex = {};

/* ================= RENDER ================= */
function render() {
    const items = getItems();
    const grid = document.getElementById("grid");
    const titleEl = document.getElementById("title");

    titleEl.innerText = cat ? cat.replace(/_/g, " ").toUpperCase() : "ALL PRODUCTS";

    if (!items.length) {
        grid.innerHTML = "<p style='text-align:center;width:100%;'>No products found</p>";
        return;
    }

    let html = "";

    for (let p of items) {

        let images = p.img ? (Array.isArray(p.img) ? p.img : [p.img]) : [];

        /* ================= SIZE SYSTEM (FIXED) ================= */
        let sizes = DEFAULT_SIZES;

        if (p.sizes && Array.isArray(p.sizes)) {
            sizes = p.sizes;
        }
        else if (p.category && CATEGORY_SIZES?.[p.category]) {
            sizes = CATEGORY_SIZES[p.category];
        }

        let sizeOptions = `<option value="">Select Size</option>`;
        sizes.forEach(s => {
            sizeOptions += `<option value="${s}">${s}</option>`;
        });

        html += `
        <div class="card">

            <div class="slider clickable" onclick="goToProduct('${p.id}')">
                <button class="prev" onclick="event.stopPropagation(); changeImg('${p.id}', -1)">‹</button>
                <img id="img-${p.id}" src="${images[0] || ''}">
                <button class="next" onclick="event.stopPropagation(); changeImg('${p.id}', 1)">›</button>
            </div>

            <h3 class="clickable" onclick="goToProduct('${p.id}')">${p.name}</h3>

           <!-- <div style="margin-bottom:5px;">€${p.price}</div> -->

            <select id="size-${p.id}">
                ${sizeOptions}
            </select>

            <button onclick="add('${p.id}')">Add to Cart</button>

        </div>`;
    }

    grid.innerHTML = html;
}

/* ================= SLIDER ================= */
function changeImg(id, dir){

  const items = getItems();
  const product = items.find(p => p.id === id);

  if(!product || !product.img) return;

  const images = Array.isArray(product.img) ? product.img : [product.img];

  if(!imgIndex[id]) imgIndex[id] = 0;

  imgIndex[id] += dir;

  if(imgIndex[id] < 0) imgIndex[id] = images.length - 1;
  if(imgIndex[id] >= images.length) imgIndex[id] = 0;

  document.getElementById(`img-${id}`).src = images[imgIndex[id]];
}

/* ================= CART ================= */
function add(id){

    const size = document.getElementById(`size-${id}`).value;

    if(!size){
        alert("Select size");
        return;
    }

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        id,
        size,
        name: PRODUCTS[id].name,
        price: PRODUCTS[id].price,
        image: PRODUCTS[id].img?.[0] || "",
        quantity: 1
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    updateCart();
    alert("Added to cart");
}

/* ================= CART COUNT ================= */
function updateCart(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("count").innerText = cart.length;
}

function goBack(){
    window.history.back();
}

function goCart(){
    window.location.href="../cart.html";
}

render();
updateCart();

</script>

</body>
</html>
