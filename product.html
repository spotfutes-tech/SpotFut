<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:18px 8%;
  border-bottom:1px solid #1e1e1e;
}

.back,.cart{cursor:pointer}

/* TITLE */
.title{
  text-align:center;
  padding:25px;
  font-size:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  padding:20px 8%;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

/* ================= SLIDER ================= */
.slider{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.slider img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.slider button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  border:none;
  color:white;
  font-size:22px;
  width:30px;
  height:40px;
  cursor:pointer;
}

.slider .prev{ left:0; }
.slider .next{ right:0; }

/* SELECT */
select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
  border:1px solid #333;
}

/* BUTTON */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="back" onclick="goBack()">← Back</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</div>

<div class="title" id="title">Products</div>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

const cat = new URLSearchParams(window.location.search).get("cat");

/* ================= SAFE GET ITEMS ================= */
function getItems(){

  if(!cat) return Object.keys(PRODUCTS).map(id => ({
    id,
    ...PRODUCTS[id]
  }));

  if(!CATEGORIES[cat]) return [];

  return CATEGORIES[cat].map(id => ({
    id,
    ...PRODUCTS[id]
  }));
}

/* ================= SLIDER STATE ================= */
const imgIndex = {};

/* ================= RENDER ================= */
function render(){

  const items = getItems();

  document.getElementById("title").innerText =
    cat ? cat.replaceAll("_"," ").toUpperCase() : "ALL PRODUCTS";

  document.getElementById("grid").innerHTML = items.map(p => {

    const images = Array.isArray(p.img) ? p.img : [p.img];

    return `
      <div class="card">

        <div class="slider">
          <button class="prev" onclick="changeImg('${p.id}', -1)">‹</button>

          <img id="img-${p.id}" src="${images[0] || ''}">

          <button class="next" onclick="changeImg('${p.id}', 1)">›</button>
        </div>

        <h3>${p.name}</h3>

        <select>
          <option>Select Size</option>
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
        </select>

        <button onclick="add('${p.id}', this)">Add to Cart</button>
      </div>
    `;
  }).join("");
}

/* ================= SLIDER FUNCTION ================= */
function changeImg(id, dir){

  const product = getItems().find(p => p.id === id);
  const images = Array.isArray(product.img) ? product.img : [product.img];

  if(!imgIndex[id]) imgIndex[id] = 0;

  imgIndex[id] += dir;

  if(imgIndex[id] < 0) imgIndex[id] = images.length - 1;
  if(imgIndex[id] >= images.length) imgIndex[id] = 0;

  document.getElementById(`img-${id}`).src = images[imgIndex[id]];
}

/* ================= CART ================= */
function add(id, btn){

  let card = btn.closest(".card");
  let size = card.querySelector("select").value;

  if(size === "Select Size"){
    alert("Select size");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({id, size});

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCart();
}

function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("count").innerText = cart.length;
}

/* ================= NAV ================= */
function goBack(){
  window.history.back();
}

function goCart(){
  window.location.href="../cart.html";
}

/* INIT */
render();
updateCart();

</script>

</body>
</html>
