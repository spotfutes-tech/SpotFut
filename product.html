<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0a0a0a;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:20px 8%;
  border-bottom:1px solid #1e1e1e;
}

.logo{cursor:pointer}
.cart{cursor:pointer}

/* NAV */
.nav{
  display:flex;
  gap:22px;
  padding:15px 8%;
  border-bottom:1px solid #1e1e1e;
  position:relative;
}

/* ITEM */
.nav-item{
  position:relative;
  cursor:pointer;
  font-size:14px;
  padding:12px 8px;
}

/* hover bridge (prevents flicker gap) */
.nav-item::after{
  content:'';
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  height:18px;
}

/* DROPDOWN */
.dropdown{
  position:absolute;
  top:45px;
  left:0;
  background:#111;
  border:1px solid #222;
  min-width:200px;

  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:0.2s ease;
  z-index:999;
}

/* OPEN STATE (controlled by JS) */
.nav-item.open .dropdown{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* LINKS */
.dropdown a{
  display:block;
  padding:10px 14px;
  color:white;
  text-decoration:none;
  font-size:13px;
}

.dropdown a:hover{
  background:#1a1a1a;
  color:#c200ff;
}

/* HERO */
.hero{
  padding:60px 8%;
  text-align:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:20px 8%;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  background:#000;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goBack()">← BACK</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</header>

<!-- NAV -->
<div class="nav">

  <div class="nav-item">All</div>

  <div class="nav-item"
       onmouseenter="openMenu(this)"
       onmouseleave="closeMenu(this)">
    Football ▾
    <div class="dropdown">
      <a href="product.html?cat=football_kits">Kits</a>
      <a href="product.html?cat=football_tracksuits">Tracksuits</a>
      <a href="product.html?cat=football_hoodies">Hoodies</a>
      <a href="product.html?cat=football_jackets">Jackets</a>
    </div>
  </div>

  <div class="nav-item"
       onmouseenter="openMenu(this)"
       onmouseleave="closeMenu(this)">
    Basketball ▾
    <div class="dropdown">
      <a href="product.html?cat=basketball_kits">Kits</a>
      <a href="product.html?cat=basketball_hoodies">Hoodies</a>
      <a href="product.html?cat=basketball_shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item"
       onmouseenter="openMenu(this)"
       onmouseleave="closeMenu(this)">
    Handball ▾
    <div class="dropdown">
      <a href="product.html?cat=handball_kits">Kits</a>
      <a href="product.html?cat=handball_tracksuits">Tracksuits</a>
      <a href="product.html?cat=handball_hoodies">Hoodies</a>
      <a href="product.html?cat=handball_shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item"
       onmouseenter="openMenu(this)"
       onmouseleave="closeMenu(this)">
    Training ▾
    <div class="dropdown">
      <a href="product.html?cat=training_tops">Tops</a>
      <a href="product.html?cat=training_shorts">Shorts</a>
      <a href="product.html?cat=training_tracksuits">Tracksuits</a>
      <a href="product.html?cat=training_compression">Compression</a>
    </div>
  </div>

  <div class="nav-item"
       onmouseenter="openMenu(this)"
       onmouseleave="closeMenu(this)">
    Lifestyle ▾
    <div class="dropdown">
      <a href="product.html?cat=lifestyle_hoodies">Hoodies</a>
      <a href="product.html?cat=lifestyle_jackets">Jackets</a>
      <a href="product.html?cat=lifestyle_joggers">Joggers</a>
      <a href="product.html?cat=lifestyle_tshirts">T-Shirts</a>
    </div>
  </div>

</div>

<!-- HERO -->
<div class="hero">
  <h1 id="title">Products</h1>
</div>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const cat = params.get("cat");

function render(){

  let items = PRODUCTS[cat] || [];

  document.getElementById("title").innerText =
    cat ? cat.replaceAll("_"," ").toUpperCase() : "ALL PRODUCTS";

  document.getElementById("grid").innerHTML = items.map(p => `
    <div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>

      <select>
        <option>Select Size</option>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <button onclick="add('${p.id}', this)">Add to Cart</button>
    </div>
  `).join("");
}

/* 🔥 FIXED MENU LOGIC */
function openMenu(el){
  document.querySelectorAll(".nav-item").forEach(i => {
    if(i !== el) i.classList.remove("open");
  });
  el.classList.add("open");
}

function closeMenu(el){
  setTimeout(() => {
    el.classList.remove("open");
  }, 120);
}

/* close if mouse leaves nav area */
document.addEventListener("mousemove", function(e){
  let nav = document.querySelector(".nav");
  if(!nav.contains(e.target)){
    document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("open"));
  }
});

/* CART */
function add(id, btn){

  let card = btn.closest(".card");
  let size = card.querySelector("select").value;

  if(size === "Select Size"){
    alert("Select size first");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({id, size});

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("count").innerText = cart.length;
}

function goBack(){
  window.location.href="men.html";
}

function goCart(){
  window.location.href="cart.html";
}

render();
updateCart();

</script>

</body>
</html>
