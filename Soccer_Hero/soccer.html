<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Soccer</title>

<link rel="stylesheet" href="../style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HERO */
.soccer-hero {
  height: 90vh;
  background: url('../assets/soccer-bg.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-content h1 {
  font-size: 48px;
}

.hero-content p {
  margin: 10px 0 20px;
}

/* BUTTON */
.btn {
  padding: 12px 24px;
  border-radius: 30px;
  text-decoration: none;
  margin: 5px;
  display: inline-block;
  font-weight: 600;
}

.primary {
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  color: white;
}

/* CATEGORY */
.categories {
  padding: 40px 5%;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

.category-card img {
  width: 100%;
  border-radius: 15px;
}

/* PRODUCTS */
.products {
  padding: 40px 5%;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.product-card {
  background: #111;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
}

.product-card img {
  width: 100%;
}

.product-card button {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 20px;
  background: #ff00cc;
  color: white;
  cursor: pointer;
}

/* CART */
.cart-icon {
  position: fixed;
  top: 20px;
  right: 20px;
  background: black;
  padding: 10px 15px;
  border-radius: 30px;
  cursor: pointer;
}

.cart-panel {
  position: fixed;
  right: -100%;
  top: 0;
  width: 300px;
  height: 100%;
  background: #111;
  padding: 20px;
  transition: 0.4s;
}

.cart-panel.active {
  right: 0;
}

/* MOBILE */
@media(max-width:768px){

  .hero-content h1 {
    font-size: 28px;
  }

  .category-grid {
    grid-template-columns: 1fr;
  }

  .product-grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<!-- CART ICON -->
<div class="cart-icon" onclick="toggleCart()">
  Cart (<span id="cart-count">0</span>)
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cart">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
</div>

<!-- HERO -->
<section class="soccer-hero">
  <div class="hero-content">
    <h1>FOOTBALL REDEFINED</h1>
    <p>Performance. Identity. SpotFut.</p>
    <a href="#products" class="btn primary">Shop Now</a>
  </div>
</section>

<!-- CATEGORIES -->
<section class="categories">
  <h2>Categories</h2>
  <div class="category-grid">
    <div class="category-card"><img src="../assets/men.jpg"></div>
    <div class="category-card"><img src="../assets/women.jpg"></div>
    <div class="category-card"><img src="../assets/junior.jpg"></div>
  </div>
</section>

<!-- PRODUCTS -->
<section id="products" class="products">
  <h2>Featured Kits</h2>

  <div class="product-grid">

    <div class="product-card">
      <img src="../assets/kit1.png">
      <h3>Elite Match Kit</h3>
      <p>€39</p>
      <button onclick="addToCart('Elite Match Kit',39)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="../assets/kit2.png">
      <h3>Training Jersey</h3>
      <p>€29</p>
      <button onclick="addToCart('Training Jersey',29)">Add to Cart</button>
    </div>

  </div>
</section>

<script src="../products.js"></script>

<script>

/* CART COUNT (UNIFIED STYLE) */
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;

  cart.forEach(item=>{
    total += item.quantity || 1;
  });

  document.getElementById("cart-count").innerText = total;
}

/* ADD TO CART (MATCH SIGNATURE SYSTEM) */
function addToCart(productId, btn){

  let card = btn.closest(".kit-card");
  let size = card.querySelector(".size").value;

  if(!size){
    alert("Please select a size");
    return;
  }

  let image = card.querySelector(".image-slider img.active").src;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({
    id: productId,
    size: size,
    quantity: 1,
    image: image
  });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();

  alert("Added to cart");
}

/* NAVIGATION (FIXED PATHS) */
function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

/* IMAGE SLIDER */
document.querySelectorAll(".image-slider").forEach(slider=>{
  let images = slider.querySelectorAll("img");
  let next = slider.querySelector(".next");
  let prev = slider.querySelector(".prev");
  let index = 0;

  function show(i){
    images.forEach(img=>img.classList.remove("active"));
    images[i].classList.add("active");
  }

  next.addEventListener("click",()=>{
    index = (index + 1) % images.length;
    show(index);
  });

  prev.addEventListener("click",()=>{
    index = (index - 1 + images.length) % images.length;
    show(index);
  });
});

/* INIT */
updateCartCount();

</script>

</body>
</html>
