<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Soccer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.soccer-hero {
  height: 75vh;
  background: url('../assets/soccer-bg.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5%;
}

.hero-content {
  max-width: 700px;
}

.hero-content h1 {
  font-size: 46px;
  letter-spacing: 2px;
}

.hero-content p {
  margin-top: 10px;
  opacity: 0.8;
}

/* =======================
CATEGORIES
======================= */
.categories {
  padding: 50px 8%;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

.category-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

.category-card img {
  width: 100%;
  display: block;
  transition: 0.4s;
}

.category-card:hover img {
  transform: scale(1.05);
}

.category-card h3 {
  position: absolute;
  bottom: 40px;
  left: 15px;
  margin: 0;
}

.category-card button {
  position: absolute;
  bottom: 12px;
  left: 15px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  opacity: 0;
  transition: 0.3s;
}

.category-card:hover button {
  opacity: 1;
}

/* =======================
SECTION GRID (HOODIE STYLE)
======================= */
.section {
  padding: 60px 8%;
}

.section h2 {
  font-size: 22px;
  margin-bottom: 20px;
}

.kit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
  gap: 40px;
}

/* CARD */
.kit-card {
  background: #111;
  padding: 20px;
  border: 1px solid #1e1e1e;
  transition: 0.4s;
}

.kit-card:hover {
  transform: translateY(-6px);
  border-color: #444;
}

/* IMAGE SLIDER */
.image-slider {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  margin-bottom: 15px;
}

.image-slider img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
  background: #0a0a0a;
}

.image-slider img.active {
  display: block;
}

.slider-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.6);
  border: none;
  color: white;
  font-size: 18px;
  padding: 6px 10px;
  cursor: pointer;
}

.prev { left: 10px; }
.next { right: 10px; }

/* SIZE */
select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: black;
  color: white;
  border: 1px solid #333;
}

/* BUTTON */
.add-btn {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  color: white;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:768px){
  .category-grid{
    grid-template-columns: 1fr;
  }

  .kit-grid{
    grid-template-columns: 1fr;
  }

  .hero-content h1{
    font-size: 28px;
  }
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<!-- HERO -->
<section class="soccer-hero">
  <div class="hero-content">
    <h1>FOOTBALL REDEFINED</h1>
    <p>Performance. Identity. SpotFut.</p>
  </div>
</section>

<!-- CATEGORIES -->
<section class="categories">
  <div class="category-grid">

    <div class="category-card" onclick="scrollTo('men')">
      <img src="SF-SJM-B001_1.jpg">
      <h3>Men</h3>
      <button>Explore</button>
    </div>

    <div class="category-card" onclick="scrollTo('women')">
      <img src="SF-SJF-S001_1.png">
      <h3>Women</h3>
      <button>Explore</button>
    </div>

    <div class="category-card" onclick="scrollTo('junior')">
      <img src="Desert Sand Elite.png">
      <h3>Juniors</h3>
      <button>Explore</button>
    </div>

  </div>
</section>

<!-- MEN -->
<section id="men" class="section">
<h2>MEN COLLECTION</h2>

<div class="kit-grid">

  <div class="kit-card">
    <div class="image-slider">
      <img src="SF-SJM-S001_1.png" class="active">
      <img src="SF-SJM-S001_2.png">
      <button class="slider-btn prev">&#10094;</button>
      <button class="slider-btn next">&#10095;</button>
    </div>
    <h3>Elite Fusion</h3>
    <select class="size">
      <option value="">Select Size</option>
      <option>S</option><option>M</option><option>L</option><option>XL</option>
    </select>
    <button class="add-btn" onclick="addToCart('SF-SJM-S001', this)">Add to Cart</button>
  </div>

</div>
</section>

<!-- WOMEN -->
<section id="women" class="section">
<h2>WOMEN COLLECTION</h2>
<div class="kit-grid">

  <div class="kit-card">
    <div class="image-slider">
      <img src="SF-SJF-S001_1.png" class="active">
      <img src="SF-SJF-S001_2.png">
      <button class="slider-btn prev">&#10094;</button>
      <button class="slider-btn next">&#10095;</button>
    </div>
    <h3>Blush Strike</h3>
    <select class="size">
      <option value="">Select Size</option>
      <option>S</option><option>M</option><option>L</option><option>XL</option>
    </select>
    <button class="add-btn" onclick="addToCart('SF-SJF-S001', this)">Add to Cart</button>
  </div>

</div>
</section>

<!-- JUNIOR -->
<section id="junior" class="section">
<h2>JUNIOR COLLECTION</h2>
<div class="kit-grid">

  <div class="kit-card">
    <div class="image-slider">
      <img src="SF-SJK-S001_1.png" class="active">
      <img src="SF-SJK-S001_2.png">
      <button class="slider-btn prev">&#10094;</button>
      <button class="slider-btn next">&#10095;</button>
    </div>
    <h3>Junior Strike</h3>
    <select class="size">
      <option>4-7 Y</option><option>8-10 Y</option>
    </select>
    <button class="add-btn" onclick="addToCart('SF-SJK-S001', this)">Add to Cart</button>
  </div>

</div>
</section>

<script>

/* CART */
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

function addToCart(id, btn){
  let card = btn.closest(".kit-card");
  let size = card.querySelector(".size").value;

  if(!size){
    alert("Select size");
    return;
  }

  let image = card.querySelector(".image-slider img.active").src;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ id, size, image, quantity:1 });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

/* SLIDER */
document.querySelectorAll(".image-slider").forEach(slider=>{
  let imgs = slider.querySelectorAll("img");
  let i = 0;

  function show(x){
    imgs.forEach(img=>img.classList.remove("active"));
    imgs[x].classList.add("active");
  }

  slider.querySelector(".next").onclick = ()=>{ i=(i+1)%imgs.length; show(i); }
  slider.querySelector(".prev").onclick = ()=>{ i=(i-1+imgs.length)%imgs.length; show(i); }
});

/* SCROLL */
function scrollTo(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

updateCartCount();

</script>

</body>
</html>
