<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Soccer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER (BACK HOME STYLE LIKE HOODIES) */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

/* CART */
.cart {
  cursor: pointer;
  font-weight: 500;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO (MORE PREMIUM) */
.soccer-hero {
  height: 75vh;
  background: url('../assets/soccer-bg.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5%;
}

.hero-content {
  max-width: 700px;
}

.hero-content h1 {
  font-size: 46px;
  letter-spacing: 2px;
}

.hero-content p {
  margin-top: 10px;
  opacity: 0.8;
}

/* CATEGORY */
.categories {
  padding: 50px 8%;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

/* ===== UPGRADED CATEGORY CARD (NEW) ===== */
.category-card {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  cursor: pointer;
}

.category-card img {
  width: 100%;
  display: block;
  transition: transform 0.5s ease;
}

.category-card:hover img {
  transform: scale(1.08);
}

/* overlay */
.category-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 20px;
  opacity: 0;
  transition: 0.4s;
  text-align: center;
}

.category-card:hover .category-overlay {
  opacity: 1;
}

.category-overlay h3 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
}

.category-overlay button {
  margin-top: 10px;
  padding: 10px 18px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  color: white;
  cursor: pointer;
  font-weight: 600;
}

/* PRODUCTS */
.products {
  padding: 50px 8%;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.product-card {
  background: #111;
  padding: 15px;
  border-radius: 14px;
  text-align: center;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
}

.product-card img {
  width: 100%;
  border-radius: 10px;
}

.product-card button {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  color: white;
  cursor: pointer;
  width: 100%;
}

/* MOBILE */
@media(max-width:768px){

  .hero-content h1 {
    font-size: 28px;
  }

  .category-grid,
  .product-grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo" onclick="goHome()">
    ← SPOTFUT
  </div>

  <div class="cart" onclick="goToCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</header>

<!-- HERO -->
<section class="soccer-hero">
  <div class="hero-content">
    <h1>FOOTBALL REDEFINED</h1>
    <p>Performance. Identity. SpotFut.</p>
  </div>
</section>

<!-- CATEGORIES (UPGRADED) -->
<section class="categories">
  <h2>Categories</h2>

  <div class="category-grid">

    <div class="category-card" onclick="scrollToSection('men')">
      <img src="SF-SJM-B001_1.jpg">
      <div class="category-overlay">
        <h3>Men</h3>
        <button>Explore Men</button>
      </div>
    </div>

    <div class="category-card" onclick="scrollToSection('women')">
      <img src="SF-SJF-S001_1.png">
      <div class="category-overlay">
        <h3>Women</h3>
        <button>Explore Women</button>
      </div>
    </div>

    <div class="category-card" onclick="scrollToSection('junior')">
      <img src="Desert Sand Elite.png">
      <div class="category-overlay">
        <h3>Junior</h3>
        <button>Explore Junior</button>
      </div>
    </div>

  </div>
</section>

<!-- PRODUCTS -->
<section class="products">
  <h2>Featured Kits</h2>

  <div class="product-grid">

    <div class="product-card">
      <img src="../assets/kit1.png">
      <h3>Elite Match Kit</h3>
      <p>€39</p>
      <button onclick="addToCart('Elite Match Kit')">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="../assets/kit2.png">
      <h3>Training Jersey</h3>
      <p>€29</p>
      <button onclick="addToCart('Training Jersey')">Add to Cart</button>
    </div>

  </div>
</section>

<script>

/* CART */
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;

  cart.forEach(item=>{
    total += item.quantity || 1;
  });

  document.getElementById("cart-count").innerText = total;
}

/* ADD TO CART */
function addToCart(productId){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({
    id: productId,
    quantity: 1
  });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();

  alert("Added to cart");
}

/* NAVIGATION */
function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

/* SMOOTH SCROLL */
function scrollToSection(id){
  const el = document.getElementById(id);
  if(el){
    el.scrollIntoView({ behavior: "smooth" });
  }
}

/* INIT */
updateCartCount();

</script>

</body>
</html>
