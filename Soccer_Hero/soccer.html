<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut Soccer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
  font-weight: 500;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.soccer-hero {
  height: 75vh;
  background: url('../assets/soccer-bg.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5%;
}

.hero-content {
  max-width: 700px;
}

.hero-content h1 {
  font-size: 46px;
  letter-spacing: 2px;
}

.hero-content p {
  margin-top: 10px;
  opacity: 0.8;
}

/* GRID */
.kit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
  padding: 50px 8%;
}

/* CARD */
.kit-card {
  background: #111;
  padding: 20px;
  border: 1px solid #1e1e1e;
  transition: 0.4s;
}

.kit-card:hover {
  border-color: #444;
  transform: translateY(-8px);
}

/* IMAGE SLIDER (HOODIES STYLE) */
.image-slider {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  margin-bottom: 15px;
}

.image-slider img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #0a0a0a;
  display: none;
}

.image-slider img.active {
  display: block;
}

.slider-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  font-size: 18px;
  padding: 6px 10px;
  cursor: pointer;
}

.prev { left: 10px; }
.next { right: 10px; }

/* SIZE SELECT */
select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #000;
  color: white;
  border: 1px solid #333;
}

/* BUTTON */
.add-btn {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: white;
  color: black;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.add-btn:hover {
  opacity: 0.85;
}

/* MOBILE */
@media(max-width:768px){
  .hero-content h1 {
    font-size: 28px;
  }

  .kit-grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<!-- HERO -->
<section class="soccer-hero">
  <div class="hero-content">
    <h1>FOOTBALL REDEFINED</h1>
    <p>Performance. Identity. SpotFut.</p>
  </div>
</section>

<!-- PRODUCTS GRID (MEN EXAMPLE - EXTENDABLE) -->
<section class="kit-grid">

<!-- CARD 1 -->
<div class="kit-card">
  <div class="image-slider">
    <img src="SF-SJM-S001_1.png" class="active">
    <img src="SF-SJM-S001_2.png">
    <img src="SF-SJM-S001_3.png">
    <img src="SF-SJM-S001_4.jpg">
    <button class="slider-btn prev">&#10094;</button>
    <button class="slider-btn next">&#10095;</button>
  </div>

  <h3>Elite Pro Fusion</h3>
  <p>Bold diagonal performance kit.</p>

  <select class="size">
    <option value="">Select Size</option>
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
  </select>

  <button class="add-btn" onclick="addToCart('SF-SJM-S001', this)">Add to Cart</button>
</div>

<!-- CARD 2 -->
<div class="kit-card">
  <div class="image-slider">
    <img src="SF-SJM-S002_1.jpg" class="active">
    <img src="SF-SJM-S002_2.jpg">
    <img src="SF-SJM-S002_3.jpg">
    <img src="SF-SJM-S002_4.jpg">
    <button class="slider-btn prev">&#10094;</button>
    <button class="slider-btn next">&#10095;</button>
  </div>

  <h3>Momentum Slash</h3>
  <p>Cut through the ordinary.</p>

  <select class="size">
    <option value="">Select Size</option>
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
  </select>

  <button class="add-btn" onclick="addToCart('SF-SJM-S002', this)">Add to Cart</button>
</div>

<!-- CARD 3 -->
<div class="kit-card">
  <div class="image-slider">
    <img src="SF-SJM-S003_1.jpg" class="active">
    <img src="SF-SJM-S003_2.jpg">
    <img src="SF-SJM-S003_3.jpg">
    <img src="SF-SJM-S003_4.jpg">
    <button class="slider-btn prev">&#10094;</button>
    <button class="slider-btn next">&#10095;</button>
  </div>

  <h3>Urban Strike</h3>
  <p>Elite match-ready design.</p>

  <select class="size">
    <option value="">Select Size</option>
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
  </select>

  <button class="add-btn" onclick="addToCart('SF-SJM-S003', this)">Add to Cart</button>
</div>

</section>

<script>

/* CART */
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;
  cart.forEach(i => total += i.quantity || 1);
  document.getElementById("cart-count").innerText = total;
}

/* ADD TO CART (IDENTICAL TO HOODIES) */
function addToCart(productId, btn){

  let card = btn.closest(".kit-card");
  let size = card.querySelector(".size").value;

  if(!size){
    alert("Please select size");
    return;
  }

  let image = card.querySelector(".image-slider img.active").src;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({
    id: productId,
    size: size,
    quantity: 1,
    image: image
  });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();

  alert("Added to cart");
}

/* SLIDER (IDENTICAL HOODIES LOGIC) */
document.querySelectorAll(".image-slider").forEach(slider=>{
  let images = slider.querySelectorAll("img");
  let next = slider.querySelector(".next");
  let prev = slider.querySelector(".prev");
  let index = 0;

  function show(i){
    images.forEach(img=>img.classList.remove("active"));
    images[i].classList.add("active");
  }

  next.addEventListener("click",()=>{
    index = (index + 1) % images.length;
    show(index);
  });

  prev.addEventListener("click",()=>{
    index = (index - 1 + images.length) % images.length;
    show(index);
  });
});

/* NAV */
function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

updateCartCount();

</script>

</body>
</html>
