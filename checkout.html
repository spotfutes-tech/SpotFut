<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | SpotFut</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:'Poppins', sans-serif;
    padding:60px 8%;
}

h1{
    font-family:'Playfair Display', serif;
    margin-bottom:30px;
}

/* BACK LINK (same as cart) */
.back-link{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:30px;
}

/* FORM */
form{
    max-width:600px;
}

input, textarea, select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#111;
    border:1px solid #333;
    color:white;
}

textarea{
    resize:none;
}

/* PAYMENT OPTIONS */
.payment-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin:25px 0;
}

.payment-card{
    border:1px solid #333;
    padding:18px;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
}

.payment-card:hover{
    border-color:white;
}

.payment-card.active{
    border:2px solid white;
    background:#111;
}

.payment-title{
    font-weight:600;
    margin-bottom:6px;
}

.payment-desc{
    font-size:0.85rem;
    opacity:0.7;
}

/* BUTTON */
button{
    width:100%;
    padding:16px;
    background:white;
    color:black;
    border:none;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}

/* NOTE */
.note{
    margin-top:10px;
    font-size:0.85rem;
    opacity:0.7;
}

</style>
</head>

<body>

<a href="index.html" class="back-link">← Back to Home</a>

<h1>Checkout</h1>

<form id="checkout-form">

<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email Address" required>
<input type="text" id="phone" placeholder="WhatsApp Number" required>
<textarea id="address" placeholder="Shipping Address" required></textarea>

<h3>Select Payment Method</h3>

<div class="payment-options">

    <div class="payment-card" onclick="selectPayment('whatsapp', this)">
        <div class="payment-title">WhatsApp Payment</div>
        <div class="payment-desc">Confirm & pay via chat</div>
    </div>

    <div class="payment-card" onclick="selectPayment('bank', this)">
        <div class="payment-title">Bank Transfer</div>
        <div class="payment-desc">Manual secure transfer</div>
    </div>

    <div class="payment-card" onclick="selectPayment('stripe', this)">
        <div class="payment-title">Card Payment</div>
        <div class="payment-desc">Visa / Mastercard (soon)</div>
    </div>

    <div class="payment-card" onclick="selectPayment('cash', this)">
        <div class="payment-title">Cash on Delivery</div>
        <div class="payment-desc">Pay when received</div>
    </div>

</div>

<input type="hidden" id="payment-method" required>

<button type="submit">Place Order</button>

<p class="note">
We will confirm your order via WhatsApp or Email within minutes.
</p>

</form>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
    emailjs.init("YOUR_PUBLIC_KEY"); // replace
})();

/* PAYMENT SELECT */
function selectPayment(method, el){

    document.getElementById("payment-method").value = method;

    document.querySelectorAll(".payment-card").forEach(card=>{
        card.classList.remove("active");
    });

    el.classList.add("active");
}

/* FORM SUBMIT */
document.getElementById("checkout-form").addEventListener("submit", function(e){
    e.preventDefault();

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length === 0){
        alert("Cart is empty");
        return;
    }

    let payment = document.getElementById("payment-method").value;

    if(!payment){
        alert("Please select a payment method");
        return;
    }

    let orderDetails = cart.map(item=>{
        return `${item.name} (Size: ${item.size}) x${item.quantity}`;
    }).join(", ");

    let params = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        payment: payment,
        order: orderDetails
    };

    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", params)
    .then(function(){
        alert("Order placed successfully!");
        localStorage.removeItem("cart");
        window.location.href = "index.html";
    }, function(error){
        alert("Error sending order. Check EmailJS.");
        console.log(error);
    });

});
</script>

</body>
</html>
