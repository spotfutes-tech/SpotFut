<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | SpotFut</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    body{margin:0;background:#0b0b0b;color:white;font-family:'Poppins', sans-serif;padding:60px 8%;}
    @media(max-width:768px){body{padding:25px 18px 100px;}}
    h1{font-family:'Playfair Display', serif;margin-bottom:25px;}
    .section{margin-bottom:25px;}
    input, textarea{width:100%;padding:14px;margin-top:10px;background:#111;border:1px solid #333;color:white;font-size:16px;border-radius:6px;}
    label{font-size:0.9rem;opacity:0.8;}
    .payment-options-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
    @media(max-width:600px){.payment-options-container{grid-template-columns:1fr;}}
    .payment-option-card{background:#111;border:1px solid #333;border-radius:12px;padding:16px;cursor:pointer;transition:all 0.25s ease;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;}
    .payment-option-card.selected{border-color:#e91e63;background:linear-gradient(90deg,#9b59b6,#e91e63);color:white;}
    .payment-box{margin-top:15px;padding:12px;background:#111;border:1px solid #333;border-radius:6px;font-size:0.9rem;}
    .btn{margin-top:30px;width:100%;padding:16px;background:white;color:black;border:none;font-weight:600;cursor:pointer;border-radius:8px;}
    @media(max-width:768px){.btn{position:fixed;bottom:15px;left:18px;right:18px;width:auto;z-index:1000;}}
    .success{text-align:center;margin-top:80px;}
</style>
</head>
<body>
<a href="index.html">← Back to Home</a>
<h1>Checkout</h1>

<form id="orderForm">
    <input type="hidden" id="orderId">

    <div class="section">
        <h3>Customer Information</h3>
        <label>Full Name</label>
        <input type="text" id="name" required>
        <label>Email</label>
        <input type="email" id="email" required>
        <label>WhatsApp Number</label>
        <input type="tel" id="whatsapp" required>
        <label>Address</label>
        <textarea id="address" required></textarea>
    </div>

    <div class="section">
        <h3>Payment Method</h3>
        <div class="payment-options-container">
            <label class="payment-option-card"><input type="radio" name="payment" value="Cash on Delivery" required> Cash on Delivery</label>
            <label class="payment-option-card"><input type="radio" name="payment" value="Bank Transfer"> Bank Transfer</label>
            <label class="payment-option-card"><input type="radio" name="payment" value="Bizum"> Bizum</label>
            <label class="payment-option-card"><input type="radio" name="payment" value="JazzCash/Easypaisa"> JazzCash / Easypaisa</label>
        </div>
        <div id="payment-info" class="payment-box"></div>
    </div>

    <div class="order-summary">
        <h3>Your Order</h3>
        <div id="order-items"></div>
        <p id="order-total"></p>
    </div>

    <button type="submit" class="btn">Place Order</button>
</form>

<div id="successMessage" class="success" style="display:none;">
    <h2>✅ Order Received</h2>
    <p id="order-id-display"></p>
    <p>Thank you for your order 💜</p>
    <p>We will contact you shortly via WhatsApp or Email.</p>
    <a href="index.html">← Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="products.js"></script>
<script>
    emailjs.init("I0GRXn92TC2QBie6R");

    const SERVICE_ID = "service_2apt1jw";
    const TEMPLATE_ID = "template_jztk8he";

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const orderID = document.getElementById("orderId").value;
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const whatsapp = document.getElementById("whatsapp").value.trim();
        const address = document.getElementById("address").value.trim();
        const paymentMethod = document.querySelector('input[name="payment"]:checked')?.value;

        if (!paymentMethod) return alert("Please select a payment method.");

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let detailsText = "";
        let total = 0;

        cart.forEach(item => {
            let product = PRODUCTS[item.id];
            let qty = item.quantity || 1;
            total += product.price * qty;
            detailsText += `${product.name} | Size: ${item.size} | Qty: ${qty} | €${product.price * qty}\n`;
        });

        const baseParams = {
            customer_name: name,
            customer_email: email,
            order_id: orderID,
            payment_method: paymentMethod,
            whatsapp: whatsapp,
            address: address,
            order_details: `Order ID: ${orderID}\n\nItems:\n${detailsText}\nTotal: €${total}`,
            shipping: "0",
            tax: "0",
            total: total
        };

        const btn = this.querySelector('button');
        btn.innerHTML = "Sending Order...";
        btn.disabled = true;

        try {
            // Send to Customer
            await emailjs.send(SERVICE_ID, TEMPLATE_ID, baseParams);

            // Send to Admin
            await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                ...baseParams,
                is_admin: true
            });

            // Success
            localStorage.removeItem("cart");
            document.getElementById("orderForm").style.display = "none";
            document.getElementById("successMessage").style.display = "block";
            document.getElementById("order-id-display").innerText = `Your Order ID: ${orderID}`;

        } catch (err) {
            console.error(err);
            alert("Failed to place order. Please try again or contact us on WhatsApp.");
        }

        btn.innerHTML = "Place Order";
        btn.disabled = false;
    });

    function generateOrderID() {
        let now = new Date();
        let datePart = now.getFullYear().toString() + 
                       String(now.getMonth()+1).padStart(2,'0') + 
                       String(now.getDate()).padStart(2,'0');
        let randomPart = Math.floor(1000 + Math.random() * 9000);
        return "SF-" + datePart + "-" + randomPart;
    }

    document.addEventListener("DOMContentLoaded", function(){
        document.getElementById("orderId").value = generateOrderID();
        
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let container = document.getElementById("order-items");
        let total = 0;
        let detailsText = "";

        cart.forEach(item => {
            let product = PRODUCTS[item.id];
            let qty = item.quantity || 1;
            total += product.price * qty;
            container.innerHTML += `<p>${product.name} | Size: ${item.size} | Qty: ${qty} | €${product.price}</p>`;
        });

        document.getElementById("order-total").innerText = `Total: €${total}`;
    });

    // Payment card selection
    document.querySelectorAll('.payment-option-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.payment-option-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            card.querySelector('input').checked = true;
        });
    });
</script>
</body>
</html>
