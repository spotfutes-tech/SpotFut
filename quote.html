<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFutWears - Quote Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:'Poppins', sans-serif;
    padding:40px 8%;
}

h1{
    font-family:'Playfair Display', serif;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

h1 span{
    font-size:0.9rem;
    font-weight:400;
}

label{
    font-size:0.9rem;
    opacity:0.8;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#111;
    border:1px solid #333;
    color:white;
}

button{
    padding:12px 20px;
    background:#c200ff;
    color:black;
    border:none;
    font-weight:600;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

button:hover{
    background:#9a00cc;
    color:white;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:10px;
}

@media(max-width:600px){
    .grid-2{
        grid-template-columns:1fr;
    }
}

#items-table{
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
}

#items-table th, #items-table td{
    border:1px solid #555;
    padding:8px;
    text-align:center;
}

#items-table th{
    background:#1a1a1a;
}

#quote-preview{
    margin-top:30px;
    padding:20px;
    background:#111;
    border:1px solid #333;
}

.quote-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.quote-footer{
    margin-top:30px;
    text-align:center;
}

.currency-switch{
    margin-top:10px;
}
</style>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

</head>
<body>

<h1>
SpotFutWears - Quote Generator
<span>
Order #: <input type="text" id="orderNumber" placeholder="Enter manually" style="width:120px;">
</span>
</h1>

<div class="currency-switch">
Currency: 
<select id="currency">
    <option value="€">€</option>
    <option value="PKR">PKR</option>
</select>
</div>

<h2>Customer Information</h2>
<div class="grid-2">
    <div>
        <label>Name</label>
        <input type="text" id="custName">
    </div>
    <div>
        <label>Contact</label>
        <input type="text" id="custContact">
    </div>
    <div>
        <label>Email</label>
        <input type="text" id="custEmail">
    </div>
    <div>
        <label>Address</label>
        <input type="text" id="custAddress">
    </div>
</div>

<h2>Add Items</h2>
<div class="grid-2">
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="text" id="itemSize" placeholder="Size">
    <input type="number" id="itemQty" placeholder="Quantity">
    <input type="number" id="itemPrice" placeholder="Price/unit">
</div>
<button onclick="addItem()">Add Item</button>

<table id="items-table">
    <thead>
        <tr>
            <th>No.</th>
            <th>Item Name</th>
            <th>Size</th>
            <th>Qty</th>
            <th>Price/unit</th>
            <th>Total Price</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<h2>Quote Preview</h2>
<div id="quote-preview">
    <div class="quote-header">
        <div><strong>SpotFutWears</strong></div>
        <div>Date: <span id="quoteDate"></span> | Validity: <span id="quoteValidity"></span></div>
    </div>
    <div><strong>Order #: </strong><span id="previewOrderNumber"></span></div>
    <div><strong>Customer:</strong> <span id="previewCustomer"></span></div>
    <div><table id="previewItems" style="width:100%; border-collapse: collapse; margin-top:10px;">
        <thead>
            <tr style="background:#1a1a1a;">
                <th style="border:1px solid #555; padding:5px;">No.</th>
                <th style="border:1px solid #555; padding:5px;">Item Name</th>
                <th style="border:1px solid #555; padding:5px;">Size</th>
                <th style="border:1px solid #555; padding:5px;">Qty</th>
                <th style="border:1px solid #555; padding:5px;">Price/unit</th>
                <th style="border:1px solid #555; padding:5px;">Total Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table></div>
</div>

<div class="quote-footer">
    <button onclick="downloadPDF()">Download PDF</button>
    <div style="margin-top:20px;">
        <img src="logo.jpg" alt="SpotFut Logo" style="height:50px;">
    </div>
</div>

<script>
let items = [];
const currencyEl = document.getElementById("currency");

function addItem(){
    const name = document.getElementById("itemName").value;
    const size = document.getElementById("itemSize").value;
    const qty = parseFloat(document.getElementById("itemQty").value);
    const price = parseFloat(document.getElementById("itemPrice").value);

    if(!name || !size || !qty || !price) return alert("Fill all item fields!");

    items.push({name,size,qty,price});
    updateTable();
    updatePreview();

    document.getElementById("itemName").value = "";
    document.getElementById("itemSize").value = "";
    document.getElementById("itemQty").value = "";
    document.getElementById("itemPrice").value = "";
}

function updateTable(){
    const tbody = document.querySelector("#items-table tbody");
    tbody.innerHTML = "";
    items.forEach((item,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i+1}</td><td>${item.name}</td><td>${item.size}</td><td>${item.qty}</td><td>${item.price} ${currencyEl.value}</td><td>${(item.qty*item.price).toFixed(2)} ${currencyEl.value}</td>`;
        tbody.appendChild(tr);
    });
}

function updatePreview(){
    document.getElementById("previewOrderNumber").innerText = document.getElementById("orderNumber").value;
    document.getElementById("previewCustomer").innerText = `${document.getElementById("custName").value}, ${document.getElementById("custContact").value}, ${document.getElementById("custEmail").value}, ${document.getElementById("custAddress").value}`;

    const tbody = document.querySelector("#previewItems tbody");
    tbody.innerHTML = "";
    items.forEach((item,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td style="border:1px solid #555; padding:5px;">${i+1}</td>
                        <td style="border:1px solid #555; padding:5px;">${item.name}</td>
                        <td style="border:1px solid #555; padding:5px;">${item.size}</td>
                        <td style="border:1px solid #555; padding:5px;">${item.qty}</td>
                        <td style="border:1px solid #555; padding:5px;">${item.price} ${currencyEl.value}</td>
                        <td style="border:1px solid #555; padding:5px;">${(item.qty*item.price).toFixed(2)} ${currencyEl.value}</td>`;
        tbody.appendChild(tr);
    });
}

// Auto-fill date and 7-day validity
const today = new Date();
document.getElementById("quoteDate").innerText = today.toLocaleDateString();
const validity = new Date();
validity.setDate(today.getDate()+7);
document.getElementById("quoteValidity").innerText = validity.toLocaleDateString();

function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const orderNo = document.getElementById("orderNumber").value;
    const customer = document.getElementById("previewCustomer").innerText;
    const currency = currencyEl.value;

    let grandTotal = 0;

    doc.setFontSize(16);
    doc.text("SpotFutWears - Quote",14,20);
    doc.setFontSize(12);
    doc.text(`Order #: ${orderNo}`,14,28);
    doc.text(`Date: ${document.getElementById("quoteDate").innerText}`,14,36);
    doc.text(`Validity: ${document.getElementById("quoteValidity").innerText}`,14,44);
    doc.text("Customer Information:",14,52);
    doc.text(customer,14,60);

    const tableColumn = ["No.", "Item Name", "Size", "Qty", "Price/unit", "Total Price"];
    const tableRows = [];

    items.forEach((item,i)=>{
        const total = item.qty * item.price;
        grandTotal += total;

        const rowData = [
            i+1,
            item.name,
            item.size,
            item.qty,
            item.price + " " + currency,
            total.toFixed(2) + " " + currency
        ];
        tableRows.push(rowData);
    });

    // 👉 Add Grand Total row
    tableRows.push([
        "",
        "",
        "",
        "",
        "Grand Total",
        grandTotal.toFixed(2) + " " + currency
    ]);

    doc.autoTable({
        startY: 70,
        head: [tableColumn],
        body: tableRows,
        theme: 'grid',
        headStyles: {fillColor: [194,0,255], textColor:255},
        styles: {textColor:255, fillColor:[0,0,0]},
        alternateRowStyles: {fillColor:[40,40,40]},
        didParseCell: function(data) {
            // 👉 Style last row (Grand Total)
            if (data.row.index === tableRows.length - 1) {
                data.cell.styles.fillColor = [194,0,255];
                data.cell.styles.textColor = 255;
                data.cell.styles.fontStyle = 'bold';
            }
        }
    });

    const img = new Image();
    img.src = "logo.jpg";
    img.onload = function(){
        const imgProps = doc.getImageProperties(img);
        const pdfWidth = doc.internal.pageSize.getWidth();
        const imgWidth = 50;
        const imgHeight = (imgProps.height * imgWidth) / imgProps.width;
        doc.addImage(img, 'JPEG', pdfWidth/2 - imgWidth/2, doc.lastAutoTable.finalY + 10, imgWidth, imgHeight);
        doc.save("SpotFut_Quote.pdf");
    }
    img.onerror = function(){
        doc.save("SpotFut_Quote.pdf");
    }
}
</script>

</body>
</html>
