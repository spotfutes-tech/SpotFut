<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Generator | SpotFutWears</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins', sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:8px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.section{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:8px;
}

.row{
    display:flex;
    gap:10px;
}

.row input{
    flex:1;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

button{
    margin-top:15px;
    padding:10px 15px;
    cursor:pointer;
}

.total{
    text-align:right;
    margin-top:15px;
    font-size:18px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="container" id="quoteArea">

<h1>SpotFutWears</h1>

<div class="section">
    <h3>Customer Details</h3>
    <input type="text" id="name" placeholder="Customer Name">
    <input type="text" id="contact" placeholder="Contact Number">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="address" placeholder="Address">
</div>

<div class="section">
    <h3>Currency</h3>
    <select id="currency">
        <option value="€">Euro (€)</option>
        <option value="PKR">PKR</option>
    </select>
</div>

<div class="section">
    <h3>Items</h3>

    <table id="itemsTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Item Name</th>
                <th>Size</th>
                <th>Qty</th>
                <th>Price / Unit</th>
                <th>Total</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button onclick="addRow()">+ Add Item</button>
</div>

<div class="total">
    Total: <span id="grandTotal">0</span>
</div>

<button onclick="downloadPDF()">Download PDF</button>

</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let table = document.querySelector("#itemsTable tbody");

function addRow(){
    let rowCount = table.rows.length + 1;

    let row = table.insertRow();

    row.innerHTML = `
        <td>${rowCount}</td>
        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="number" value="1" onchange="calc()"></td>
        <td><input type="number" value="0" onchange="calc()"></td>
        <td class="rowTotal">0</td>
        <td><button onclick="removeRow(this)">X</button></td>
    `;
}

function removeRow(btn){
    btn.parentElement.parentElement.remove();
    calc();
}

function calc(){
    let total = 0;
    let currency = document.getElementById("currency").value;

    Array.from(table.rows).forEach((row, index) => {
        row.cells[0].innerText = index + 1;

        let qty = row.cells[3].querySelector("input").value || 0;
        let price = row.cells[4].querySelector("input").value || 0;

        let rowTotal = qty * price;
        row.cells[5].innerText = rowTotal;

        total += rowTotal;
    });

    document.getElementById("grandTotal").innerText = currency + " " + total;
}

document.addEventListener("input", calc);

function downloadPDF(){
    const { jsPDF } = window.jspdf;
    let doc = new jsPDF();

    let y = 10;

    doc.setFontSize(16);
    doc.text("SpotFutWears", 10, y);

    y += 10;

    doc.setFontSize(10);
    doc.text("Name: " + document.getElementById("name").value, 10, y);
    y += 6;
    doc.text("Contact: " + document.getElementById("contact").value, 10, y);
    y += 6;
    doc.text("Email: " + document.getElementById("email").value, 10, y);
    y += 6;
    doc.text("Address: " + document.getElementById("address").value, 10, y);

    y += 10;

    doc.text("Items:", 10, y);
    y += 6;

    Array.from(table.rows).forEach((row, index) => {
        let name = row.cells[1].querySelector("input").value;
        let size = row.cells[2].querySelector("input").value;
        let qty = row.cells[3].querySelector("input").value;
        let price = row.cells[4].querySelector("input").value;
        let total = row.cells[5].innerText;

        doc.text(`${index+1}. ${name} | ${size} | Qty: ${qty} | ${price} | Total: ${total}`, 10, y);
        y += 6;
    });

    y += 10;
    doc.text("Total: " + document.getElementById("grandTotal").innerText, 10, y);

    doc.save("SpotFut_Quote.pdf");
}

// Add first row by default
addRow();

</script>

</body>
</html>
