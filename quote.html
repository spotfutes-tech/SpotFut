<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFutWears - Quote Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    color:#c200ff;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    background:#111;
    border:1px solid #333;
    color:white;
}

button{
    padding:10px 15px;
    border:none;
    background:#c200ff;
    color:black;
    cursor:pointer;
    font-weight:bold;
    margin-right:10px;
}

button:hover{
    background:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    border:1px solid #333;
    padding:10px;
    text-align:center;
}

.preview{
    background:white;
    color:black;
    padding:30px;
    margin-top:40px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
</style>
</head>

<body>

<div class="container">

<div class="top-bar">
<h1>SpotFutWears - Quote Generator</h1>

<select id="currency">
<option value="€">€ Euro</option>
<option value="PKR">PKR</option>
</select>
</div>

<label>Order Number</label>
<input type="text" id="orderNo">

<h3>Customer Information</h3>

<label>Name</label>
<input type="text" id="name">

<label>Contact</label>
<input type="text" id="contact">

<label>Email</label>
<input type="text" id="email">

<label>Address</label>
<input type="text" id="address">

<h3>Add Item</h3>

<input type="text" id="itemName" placeholder="Item Name">
<input type="text" id="size" placeholder="Size">
<input type="number" id="qty" placeholder="Quantity">
<input type="number" id="price" placeholder="Price per unit">

<button onclick="addItem()">Add Item</button>

<table id="itemsTable">
<tr>
<th>#</th>
<th>Name</th>
<th>Size</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</table>

<br>
<button onclick="generatePreview()">Preview Quote</button>
<button onclick="downloadPDF()">Download PDF</button>

<div id="preview" class="preview" style="display:none;">

<h2>SpotFutWears</h2>

<div style="display:flex; justify-content:space-between;">
<div>
<p><strong>Date:</strong> <span id="date"></span></p>
<p><strong>Valid Until:</strong> <span id="validDate"></span></p>
</div>

<div>
<p><strong>Order #:</strong> <span id="pOrder"></span></p>
</div>
</div>

<hr>

<h3>Customer Information</h3>
<p><strong>Name:</strong> <span id="pName"></span></p>
<p><strong>Contact:</strong> <span id="pContact"></span></p>
<p><strong>Email:</strong> <span id="pEmail"></span></p>
<p><strong>Address:</strong> <span id="pAddress"></span></p>

<h3>Items</h3>

<table id="previewTable">
<tr>
<th>#</th>
<th>Name</th>
<th>Size</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</table>

<h3>Total: <span id="grandTotal"></span></h3>

<div style="text-align:center; margin-top:40px;">
<img src="logo.jpg" width="120">
</div>

</div>

</div>

<script>

let items = [];

function addItem(){
    let name = document.getElementById("itemName").value;
    let size = document.getElementById("size").value;
    let qty = document.getElementById("qty").value;
    let price = document.getElementById("price").value;

    if(!name || !qty || !price) return alert("Fill all fields");

    let total = qty * price;

    items.push({name, size, qty, price, total});

    renderTable();

    document.getElementById("itemName").value="";
    document.getElementById("size").value="";
    document.getElementById("qty").value="";
    document.getElementById("price").value="";
}

function renderTable(){
    let table = document.getElementById("itemsTable");

    table.innerHTML = `
    <tr>
    <th>#</th><th>Name</th><th>Size</th><th>Qty</th><th>Price</th><th>Total</th>
    </tr>`;

    items.forEach((item,i)=>{
        table.innerHTML += `
        <tr>
        <td>${i+1}</td>
        <td>${item.name}</td>
        <td>${item.size}</td>
        <td>${item.qty}</td>
        <td>${item.price}</td>
        <td>${item.total}</td>
        </tr>`;
    });
}

function generatePreview(){

    let currency = document.getElementById("currency").value;

    document.getElementById("preview").style.display="block";

    document.getElementById("pOrder").innerText = document.getElementById("orderNo").value;
    document.getElementById("pName").innerText = document.getElementById("name").value;
    document.getElementById("pContact").innerText = document.getElementById("contact").value;
    document.getElementById("pEmail").innerText = document.getElementById("email").value;
    document.getElementById("pAddress").innerText = document.getElementById("address").value;

    // Date
    let today = new Date();
    let valid = new Date();
    valid.setDate(today.getDate() + 7);

    document.getElementById("date").innerText = today.toLocaleDateString();
    document.getElementById("validDate").innerText = valid.toLocaleDateString();

    let table = document.getElementById("previewTable");

    table.innerHTML = `
    <tr>
    <th>#</th><th>Name</th><th>Size</th><th>Qty</th><th>Price</th><th>Total</th>
    </tr>`;

    let grand = 0;

    items.forEach((item,i)=>{
        grand += item.total;

        table.innerHTML += `
        <tr>
        <td>${i+1}</td>
        <td>${item.name}</td>
        <td>${item.size}</td>
        <td>${item.qty}</td>
        <td>${currency} ${item.price}</td>
        <td>${currency} ${item.total}</td>
        </tr>`;
    });

    document.getElementById("grandTotal").innerText = currency + " " + grand;
}

function downloadPDF(){
    generatePreview();

    let element = document.getElementById("preview");

    html2pdf().from(element).save("SpotFut_Quote.pdf");
}

</script>

</body>
</html>
