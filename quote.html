<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpotFutWears Quote Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

h1 {
    color: #c200ff;
}

.section-title {
    margin-top: 20px;
    color: #c200ff;
}

input, select {
    padding: 8px;
    margin: 5px;
    width: 200px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: white;
}

button {
    padding: 10px 14px;
    margin: 8px 5px 0 0;
    background: #c200ff;
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #9a00cc;
}

.preview {
    margin-top: 30px;
    background: #111;
    padding: 20px;
    border-radius: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid #c200ff;
    padding-bottom: 10px;
}

.orderNo {
    text-align: right;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: #c200ff;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #333;
}

.total {
    text-align: right;
    margin-top: 15px;
    font-size: 18px;
}

.logo {
    text-align: center;
    margin-top: 20px;
}

.logo img {
    height: 60px;
}
</style>
</head>

<body>

<div class="container">

<h1>SpotFutWears - Quote Generator</h1>

<!-- CURRENCY -->
<select id="currency">
    <option value="€">Euro (€)</option>
    <option value="PKR">PKR</option>
</select>

<!-- CUSTOMER INFO -->
<h3 class="section-title">Customer Information</h3>
<input id="name" placeholder="Name">
<input id="contact" placeholder="Contact">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">

<!-- ORDER -->
<h3 class="section-title">Order Details</h3>
<input id="orderNo" placeholder="Order Number">

<!-- ITEMS -->
<h3 class="section-title">Add Items</h3>
<input id="item" placeholder="Item Name">
<input id="size" placeholder="Size">
<input id="qty" type="number" placeholder="Qty">
<input id="price" type="number" placeholder="Price">

<br>
<button onclick="addItem()">Add Item</button>
<button onclick="generatePreview()">Preview Quote</button>
<button onclick="downloadPDF()">Download PDF</button>

<!-- PREVIEW -->
<div class="preview" id="preview" style="display:none">

    <div class="header">
        <div>
            <h2>SpotFutWears</h2>
            <small>Quote Generator</small>
        </div>
        <div class="orderNo">
            <b>Order No:</b> <span id="pOrder"></span>
        </div>
    </div>

    <h3 class="section-title">Customer Information</h3>
    <p><b>Name:</b> <span id="pName"></span></p>
    <p><b>Contact:</b> <span id="pContact"></span></p>
    <p><b>Email:</b> <span id="pEmail"></span></p>
    <p><b>Address:</b> <span id="pAddress"></span></p>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th>Size</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="total" id="total"></div>

    <div class="logo">
        <img src="logo.jpg">
    </div>

</div>

</div>

<script>
let items = [];

function addItem() {
    let item = document.getElementById("item").value;
    let size = document.getElementById("size").value;
    let qty = document.getElementById("qty").value;
    let price = document.getElementById("price").value;

    if (!item || !qty || !price) {
        alert("Fill all item fields");
        return;
    }

    items.push({item, size, qty, price});

    alert("Item added ✔");

    document.getElementById("item").value = "";
    document.getElementById("size").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("price").value = "";
}

function generatePreview() {
    document.getElementById("preview").style.display = "block";

    let currency = document.getElementById("currency").value;

    document.getElementById("pOrder").innerText = orderNo.value;
    document.getElementById("pName").innerText = name.value;
    document.getElementById("pContact").innerText = contact.value;
    document.getElementById("pEmail").innerText = email.value;
    document.getElementById("pAddress").innerText = address.value;

    let table = document.getElementById("tableBody");
    table.innerHTML = "";

    let total = 0;

    items.forEach((it, i) => {
        let row = `
        <tr>
            <td>${i+1}</td>
            <td>${it.item}</td>
            <td>${it.size}</td>
            <td>${it.qty}</td>
            <td>${currency} ${it.price}</td>
            <td>${currency} ${it.qty * it.price}</td>
        </tr>`;
        table.innerHTML += row;

        total += it.qty * it.price;
    });

    document.getElementById("total").innerText = "Total: " + currency + " " + total;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let currency = document.getElementById("currency").value;

    doc.setFontSize(18);
    doc.text("SpotFutWears Quotation", 14, 20);

    doc.setFontSize(12);
    doc.text("Order No: " + orderNo.value, 14, 30);

    doc.text("Name: " + name.value, 14, 40);
    doc.text("Contact: " + contact.value, 14, 48);
    doc.text("Email: " + email.value, 14, 56);
    doc.text("Address: " + address.value, 14, 64);

    let y = 75;

    doc.setFillColor(194,0,255);
    doc.rect(14, y, 180, 8, "F");

    doc.setTextColor(255,255,255);
    doc.text("#", 16, y+6);
    doc.text("Item", 30, y+6);
    doc.text("Size", 80, y+6);
    doc.text("Qty", 110, y+6);
    doc.text("Price", 130, y+6);
    doc.text("Total", 160, y+6);

    doc.setTextColor(0,0,0);
    y += 12;

    let total = 0;

    items.forEach((it, i) => {
        doc.text(String(i+1), 16, y);
        doc.text(it.item, 30, y);
        doc.text(it.size, 80, y);
        doc.text(String(it.qty), 110, y);
        doc.text(currency + " " + it.price, 130, y);
        doc.text(currency + " " + (it.qty * it.price), 160, y);

        total += it.qty * it.price;
        y += 10;
    });

    doc.text("Total: " + currency + " " + total, 140, y+10);

    const img = new Image();
    img.src = "logo.jpg";

    img.onload = function () {
        doc.addImage(img, "JPEG", 80, y+20, 50, 20);
        doc.save("quote.pdf");
    };
}
</script>

</body>
</html>
