<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpotFutWears Quotation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

h1 {
    color: #c200ff;
}

input {
    padding: 8px;
    margin: 5px;
    width: 180px;
}

button {
    padding: 10px 14px;
    margin-top: 10px;
    background: #c200ff;
    color: white;
    border: none;
    cursor: pointer;
}

.preview {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    border-bottom: 3px solid #c200ff;
    padding-bottom: 10px;
}

.order input {
    padding: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table th {
    background: #c200ff;
    color: white;
    padding: 10px;
}

table td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.total {
    text-align: right;
    font-size: 18px;
    margin-top: 15px;
    font-weight: bold;
}

.logo-bottom {
    text-align: center;
    margin-top: 30px;
}

.logo-bottom img {
    height: 60px;
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

<h1>SpotFutWears - Quote Generator</h1>

<!-- CUSTOMER INFO -->
<input id="name" placeholder="Customer Name">
<input id="contact" placeholder="Contact">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">

<h3>Add Item</h3>
<input id="item" placeholder="Item Name">
<input id="size" placeholder="Size">
<input id="qty" type="number" placeholder="Qty">
<input id="price" type="number" placeholder="Price">

<br>
<button onclick="addItem()">Add Item</button>
<button onclick="generatePreview()">Preview</button>
<button onclick="downloadPDF()">Download PDF</button>

<!-- PREVIEW -->
<div class="preview" id="preview" style="display:none">

    <div class="header">
        <h2>SpotFutWears</h2>
        <div class="order">
            Order No: <input type="text" id="orderNo" placeholder="Enter Order No">
        </div>
    </div>

    <p><b>Name:</b> <span id="pName"></span></p>
    <p><b>Contact:</b> <span id="pContact"></span></p>
    <p><b>Email:</b> <span id="pEmail"></span></p>
    <p><b>Address:</b> <span id="pAddress"></span></p>

    <table id="itemsTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th>Size</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="total" id="grandTotal"></div>

    <!-- LOGO -->
    <div class="logo-bottom">
        <img src="logo.jpg" alt="SpotFut Logo">
    </div>

</div>

</div>

<script>
let items = [];

function addItem() {
    let item = document.getElementById("item").value;
    let size = document.getElementById("size").value;
    let qty = document.getElementById("qty").value;
    let price = document.getElementById("price").value;

    if (!item || !qty || !price) return alert("Fill item details");

    items.push({item, size, qty, price});

    document.getElementById("item").value = "";
    document.getElementById("size").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("price").value = "";
}

function generatePreview() {
    document.getElementById("preview").style.display = "block";

    document.getElementById("pName").innerText = name.value;
    document.getElementById("pContact").innerText = contact.value;
    document.getElementById("pEmail").innerText = email.value;
    document.getElementById("pAddress").innerText = address.value;

    let tbody = document.querySelector("#itemsTable tbody");
    tbody.innerHTML = "";

    let total = 0;

    items.forEach((it, i) => {
        let row = `<tr>
            <td>${i+1}</td>
            <td>${it.item}</td>
            <td>${it.size}</td>
            <td>${it.qty}</td>
            <td>${it.price}</td>
            <td>${it.qty * it.price}</td>
        </tr>`;
        tbody.innerHTML += row;

        total += it.qty * it.price;
    });

    document.getElementById("grandTotal").innerText = "Total: €" + total;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.text("SpotFutWears Quotation", 14, 20);

    doc.setFontSize(12);
    doc.text("Order No: " + document.getElementById("orderNo").value, 14, 30);

    doc.text("Name: " + name.value, 14, 40);
    doc.text("Contact: " + contact.value, 14, 48);
    doc.text("Email: " + email.value, 14, 56);
    doc.text("Address: " + address.value, 14, 64);

    let y = 75;

    doc.setFillColor(194,0,255);
    doc.setTextColor(255,255,255);
    doc.rect(14, y, 180, 8, "F");

    doc.text("#", 16, y+6);
    doc.text("Item", 30, y+6);
    doc.text("Size", 80, y+6);
    doc.text("Qty", 110, y+6);
    doc.text("Price", 130, y+6);
    doc.text("Total", 160, y+6);

    doc.setTextColor(0,0,0);
    y += 12;

    let total = 0;

    items.forEach((it, i) => {
        doc.text(String(i+1), 16, y);
        doc.text(it.item, 30, y);
        doc.text(it.size, 80, y);
        doc.text(String(it.qty), 110, y);
        doc.text(String(it.price), 130, y);
        doc.text(String(it.qty * it.price), 160, y);

        total += it.qty * it.price;
        y += 10;
    });

    doc.text("Total: €" + total, 140, y+10);

    // LOGO at bottom
    try {
        const img = new Image();
        img.src = "logo.jpg";

        img.onload = function () {
            doc.addImage(img, "JPEG", 80, y+20, 50, 20);
            doc.save("quote.pdf");
        };
    } catch {
        doc.save("quote.pdf");
    }
}
</script>

</body>
</html>
