<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER (same as soccer style) */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
  font-weight: 500;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO (small like soccer) */
.hero {
  height: 15vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5%;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  top:0;
  left:0;
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h1 {
  font-size: 42px;
  letter-spacing: 2px;
}

.hero-content p {
  margin-top: 10px;
  opacity: 0.8;
}

/* CATEGORY JUMP BAR */
.categories {
  padding: 25px 8%;
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.cat-btn {
  padding: 8px 16px;
  border: 1px solid #333;
  background: transparent;
  color: white;
  cursor: pointer;
  border-radius: 20px;
  transition: 0.3s;
}

.cat-btn:hover {
  background: #c200ff;
  border-color: #c200ff;
}

/* PRODUCT SECTION */
.products {
  padding: 30px 8%;
}

.section-title {
  font-size: 18px;
  margin: 40px 0 20px;
  border-left: 3px solid white;
  padding-left: 10px;
}

/* GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 30px;
}

/* CARD */
.product-card {
  background: #111;
  padding: 18px;
  border: 1px solid #1e1e1e;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
}

/* IMAGE */
.product-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  background: #0a0a0a;
}

/* BUTTON */
.add-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  color: white;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:768px){
.hero-content h1 { font-size: 26px; }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
    <p>Performance engineered for modern movement</p>
  </div>
</section>

<!-- CATEGORY JUMP -->
<div class="categories">
  <button class="cat-btn" onclick="scrollToSection('kits')">Kits</button>
  <button class="cat-btn" onclick="scrollToSection('tracksuits')">Tracksuits</button>
  <button class="cat-btn" onclick="scrollToSection('hoodies')">Hoodies</button>
  <button class="cat-btn" onclick="scrollToSection('jackets')">Jackets</button>
</div>

<!-- KITS -->
<section class="products" id="kits">
  <div class="section-title">Kits</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/SF-KIT-01.jpg">
      <h3>Elite Kit</h3>
      <button class="add-btn">View</button>
    </div>

  </div>
</section>

<!-- TRACKSUITS -->
<section class="products" id="tracksuits">
  <div class="section-title">Tracksuits</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/SF-TRK-01.jpg">
      <h3>Urban Tracksuit</h3>
      <button class="add-btn">View</button>
    </div>

  </div>
</section>

<!-- HOODIES -->
<section class="products" id="hoodies">
  <div class="section-title">Hoodies</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/SF-HOD-01.jpg">
      <h3>Street Hoodie</h3>
      <button class="add-btn">View</button>
    </div>

  </div>
</section>

<!-- JACKETS -->
<section class="products" id="jackets">
  <div class="section-title">Jackets</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/SF-JKT-01.jpg">
      <h3>Performance Jacket</h3>
      <button class="add-btn">View</button>
    </div>

  </div>
</section>

<script>

function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

function scrollToSection(id){
  document.getElementById(id).scrollIntoView({
    behavior:"smooth"
  });
}

function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

updateCartCount();

</script>

</body>
</html>
