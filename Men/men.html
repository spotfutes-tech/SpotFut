<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
}

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h1 {
  font-size: 42px;
}

/* NAV */
.nav {
  display: flex;
  gap: 18px;
  padding: 18px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 72px;
  background: #0a0a0a;
  z-index: 999;
}

.nav-item {
  position: relative;
  font-size: 14px;
  cursor: pointer;
  padding: 8px;
  transition: 0.2s;
}

.nav-item:hover {
  color: #c200ff;
}

/* IMPORTANT hover bridge fix */
.nav-item::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 20px;
}

/* DROPDOWN */
.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 10px;
  background: #111;
  border: 1px solid #222;
  min-width: 190px;

  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: 0.25s ease;
}

/* smooth hover */
.nav-item:hover .dropdown,
.dropdown:hover {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown a {
  display: block;
  padding: 10px 12px;
  color: white;
  text-decoration: none;
  font-size: 13px;
}

.dropdown a:hover {
  background: #1a1a1a;
  color: #c200ff;
}

/* mobile */
@media(max-width:768px){
  .nav{flex-wrap:wrap;}
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒</div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
  </div>
</section>

<div class="nav">

  <div class="nav-item">All</div>

  <div class="nav-item">
    Football ▾
    <div class="dropdown">
      <a href="product.html?sport=football&type=kits">Kits</a>
      <a href="product.html?sport=football&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=football&type=hoodies">Hoodies</a>
      <a href="product.html?sport=football&type=jackets">Jackets</a>
    </div>
  </div>

  <div class="nav-item">
    Basketball ▾
    <div class="dropdown">
      <a href="product.html?sport=basketball&type=kits">Kits</a>
      <a href="product.html?sport=basketball&type=hoodies">Hoodies</a>
      <a href="product.html?sport=basketball&type=shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item">
    Handball ▾
    <div class="dropdown">
      <a href="product.html?sport=handball&type=kits">Kits</a>
      <a href="product.html?sport=handball&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=handball&type=hoodies">Hoodies</a>
      <a href="product.html?sport=handball&type=shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item">
    Training ▾
    <div class="dropdown">
      <a href="product.html?sport=training&type=tops">Tops</a>
      <a href="product.html?sport=training&type=shorts">Shorts</a>
      <a href="product.html?sport=training&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=training&type=compression">Compression</a>
    </div>
  </div>

  <div class="nav-item">
    Lifestyle ▾
    <div class="dropdown">
      <a href="product.html?sport=lifestyle&type=hoodies">Hoodies</a>
      <a href="product.html?sport=lifestyle&type=jackets">Jackets</a>
      <a href="product.html?sport=lifestyle&type=joggers">Joggers</a>
      <a href="product.html?sport=lifestyle&type=tshirts">T-Shirts</a>
    </div>
  </div>

</div>

<script>
function goHome(){
  window.location.href="../index.html";
}
function goToCart(){
  window.location.href="../cart.html";
}
</script>

</body>
</html>
