<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo { cursor: pointer; font-size: 14px; }
.cart { cursor: pointer; }

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

/* NAV */
.nav {
  display: flex;
  gap: 22px;
  padding: 18px 8%;
  border-bottom: 1px solid #1e1e1e;
}

/* NAV ITEM */
.nav-item {
  position: relative;
  font-size: 14px;
  cursor: pointer;
  padding: 10px 6px;
  transition: 0.2s;
}

.nav-item:hover {
  color: #c200ff;
}

/* 🔥 KEY FIX: hover bridge (prevents dropdown disappearing) */
.nav-item::after {
  content: '';
  position: absolute;
  left: 0;
  top: 100%;
  width: 100%;
  height: 18px;
}

/* DROPDOWN */
.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 10px;

  background: #111;
  border: 1px solid #222;
  min-width: 190px;

  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);

  transition: 0.25s ease;
  z-index: 999;
}

/* ⭐ CRITICAL FIX: keep open on BOTH hover areas */
.nav-item:hover .dropdown,
.dropdown:hover {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

/* LINKS */
.dropdown a {
  display: block;
  padding: 10px 12px;
  text-decoration: none;
  color: white;
  font-size: 13px;
  transition: 0.2s;
}

.dropdown a:hover {
  background: #1a1a1a;
  color: #c200ff;
}

/* GRID */
.products {
  padding: 30px 8%;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap: 30px;
}

.product-card {
  background: #111;
  padding: 18px;
  border: 1px solid #1e1e1e;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
}

.product-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  background: #0a0a0a;
}

select, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  color: white;
}

select { background: #000; border: 1px solid #333; }

button {
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  cursor: pointer;
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒</div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
  </div>
</div>

<!-- NAV -->
<div class="nav">

  <div class="nav-item">All</div>

  <div class="nav-item">
    Football
    <div class="dropdown">
      <a href="product.html?cat=football_kits">Kits</a>
      <a href="product.html?cat=football_tracksuits">Tracksuits</a>
      <a href="product.html?cat=football_hoodies">Hoodies</a>
      <a href="product.html?cat=football_jackets">Jackets</a>
    </div>
  </div>

  <div class="nav-item">
    Basketball
    <div class="dropdown">
      <a href="product.html?cat=basketball_kits">Kits</a>
      <a href="product.html?cat=basketball_hoodies">Hoodies</a>
      <a href="product.html?cat=basketball_shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item">
    Handball
    <div class="dropdown">
      <a href="product.html?cat=handball_kits">Kits</a>
      <a href="product.html?cat=handball_tracksuits">Tracksuits</a>
      <a href="product.html?cat=handball_hoodies">Hoodies</a>
      <a href="product.html?cat=handball_shorts">Shorts</a>
    </div>
  </div>

</div>

</body>
</html>
