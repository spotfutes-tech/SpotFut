<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo { cursor:pointer; font-size:14px; letter-spacing:2px; }
.cart { cursor:pointer; }

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  text-align:center;
}

.hero-content h1 { font-size:42px; }
.hero-content p { opacity:0.8; }

/* ACCORDION */
.accordion {
  width: 86%;
  margin: 30px auto;
}

.sport {
  margin-bottom: 14px;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  overflow: hidden;
}

/* SPORT HEADER */
.sport-header {
  padding: 18px;
  background: #111;
  cursor: pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.3s;
}

.sport-header:hover {
  background:#1a1a1a;
}

/* ICON */
.arrow {
  transition:0.3s;
}

/* CONTENT */
.sport-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  background: #0a0a0a;
}

/* SUBCATEGORY */
.sub-title {
  padding: 14px 18px;
  font-size: 14px;
  opacity: 0.9;
  border-left: 3px solid #fff;
  margin: 10px 18px;
}

/* GRID */
.product-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: 18px;
  padding: 0 18px 20px;
}

/* CARD */
.product-card {
  background:#111;
  padding:14px;
  border:1px solid #1e1e1e;
}

.product-card img {
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
}

select {
  width:100%;
  padding:8px;
  margin-top:8px;
  background:black;
  color:white;
}

.add-btn {
  width:100%;
  padding:10px;
  margin-top:8px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
    <p>Built for every sport</p>
  </div>
</section>

<!-- ACCORDION START -->
<div class="accordion">

<!-- FOOTBALL -->
<div class="sport">
  <div class="sport-header" onclick="toggle(this)">
    Football <span class="arrow">⌄</span>
  </div>

  <div class="sport-content">

    <div class="sub-title">Kits</div>
    <div class="product-grid">
      <div class="product-card"> <img src="../Men_Images/fk1.jpg"><h3>Elite Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FK1',this)">Add</button></div>
      <div class="product-card"> <img src="../Men_Images/fk2.jpg"><h3>Pro Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FK2',this)">Add</button></div>
      <div class="product-card"> <img src="../Men_Images/fk3.jpg"><h3>Speed Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FK3',this)">Add</button></div>
    </div>

    <div class="sub-title">Tracksuits</div>
    <div class="product-grid">
      <div class="product-card"><img src="../Men_Images/ft1.jpg"><h3>Track Black</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FT1',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/ft2.jpg"><h3>Track Grey</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FT2',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/ft3.jpg"><h3>Track Blue</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('FT3',this)">Add</button></div>
    </div>

  </div>
</div>

<!-- BASKETBALL -->
<div class="sport">
  <div class="sport-header" onclick="toggle(this)">
    Basketball <span class="arrow">⌄</span>
  </div>

  <div class="sport-content">
    <div class="sub-title">Kits</div>
    <div class="product-grid">
      <div class="product-card"><img src="../Men_Images/bk1.jpg"><h3>Hoops Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('BK1',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/bk2.jpg"><h3>Dunk Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('BK2',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/bk3.jpg"><h3>Arena Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('BK3',this)">Add</button></div>
    </div>
  </div>
</div>

<!-- HANDBALL -->
<div class="sport">
  <div class="sport-header" onclick="toggle(this)">
    Handball <span class="arrow">⌄</span>
  </div>

  <div class="sport-content">
    <div class="sub-title">Kits</div>
    <div class="product-grid">
      <div class="product-card"><img src="../Men_Images/hb1.jpg"><h3>Speed Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('HB1',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/hb2.jpg"><h3>Grip Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('HB2',this)">Add</button></div>
      <div class="product-card"><img src="../Men_Images/hb3.jpg"><h3>Arena Kit</h3><select><option>S</option><option>M</option><option>L</option></select><button class="add-btn" onclick="addToCart('HB3',this)">Add</button></div>
    </div>
  </div>
</div>

</div>

<script>

function goHome(){ window.location.href="../index.html"; }
function goToCart(){ window.location.href="../cart.html"; }

/* ACCORDION (AUTO CLOSE) */
function toggle(el){

  let all = document.querySelectorAll(".sport-content");

  all.forEach(c=>{
    if(c !== el.nextElementSibling){
      c.style.maxHeight = null;
      c.previousElementSibling.querySelector(".arrow").style.transform="rotate(0deg)";
    }
  });

  let content = el.nextElementSibling;

  if(content.style.maxHeight){
    content.style.maxHeight = null;
    el.querySelector(".arrow").style.transform="rotate(0deg)";
  } else {
    content.style.maxHeight = content.scrollHeight + "px";
    el.querySelector(".arrow").style.transform="rotate(180deg)";
  }
}

/* CART */
function addToCart(id,btn){

  let card = btn.closest(".product-card");
  let size = card.querySelector("select").value;

  if(!size || size === "Select Size"){
    alert("Select size");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({id,size});

  localStorage.setItem("cart", JSON.stringify(cart));
  document.getElementById("cart-count").innerText = cart.length;
}

</script>

</body>
</html>
