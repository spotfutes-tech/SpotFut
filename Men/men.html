<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
}

.logo{cursor:pointer}
.cart{cursor:pointer}

/* NAV */
.nav{
  display:flex;
  gap:18px;
  padding:18px 8%;
  border-bottom:1px solid #1e1e1e;
  position:sticky;
  top:72px;
  background:#0a0a0a;
  z-index:1000;
}

.nav-item{
  position:relative;
  cursor:pointer;
  font-size:14px;
}

.nav-item:hover{
  color:#c200ff;
}

/* dropdown stability fix */
.nav-item::after{
  content:'';
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  height:18px;
}

.dropdown{
  position:absolute;
  top:100%;
  left:0;
  margin-top:10px;
  background:#111;
  border:1px solid #222;
  min-width:180px;

  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:0.25s ease;
}

.nav-item:hover .dropdown,
.dropdown:hover{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.dropdown a{
  display:block;
  padding:10px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#1a1a1a;
  color:#c200ff;
}

/* HERO */
.hero{
  height:45vh;
  background:url('../Images/Men.jpg') center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.hero::after{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.hero h1{
  position:relative;
  z-index:2;
  font-size:42px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:20px 8%;
}

.card{
  background:#111;
  padding:15px;
  border:1px solid #1e1e1e;
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  background:#000;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:linear-gradient(45deg,#6a00ff,#ff00cc);
  border:none;
  color:white;
  cursor:pointer;
}

select{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#000;
  color:white;
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</header>

<!-- NAV -->
<div class="nav">

  <div class="nav-item">All</div>

  <div class="nav-item">Football
    <div class="dropdown">
      <a href="product.html?sport=football&type=kits">Kits</a>
      <a href="product.html?sport=football&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=football&type=hoodies">Hoodies</a>
      <a href="product.html?sport=football&type=jackets">Jackets</a>
    </div>
  </div>

  <div class="nav-item">Basketball
    <div class="dropdown">
      <a href="product.html?sport=basketball&type=kits">Kits</a>
      <a href="product.html?sport=basketball&type=hoodies">Hoodies</a>
      <a href="product.html?sport=basketball&type=shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item">Handball
    <div class="dropdown">
      <a href="product.html?sport=handball&type=kits">Kits</a>
      <a href="product.html?sport=handball&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=handball&type=hoodies">Hoodies</a>
      <a href="product.html?sport=handball&type=shorts">Shorts</a>
    </div>
  </div>

  <div class="nav-item">Training
    <div class="dropdown">
      <a href="product.html?sport=training&type=tops">Tops</a>
      <a href="product.html?sport=training&type=shorts">Shorts</a>
      <a href="product.html?sport=training&type=tracksuits">Tracksuits</a>
      <a href="product.html?sport=training&type=compression">Compression</a>
    </div>
  </div>

  <div class="nav-item">Lifestyle
    <div class="dropdown">
      <a href="product.html?sport=lifestyle&type=hoodies">Hoodies</a>
      <a href="product.html?sport=lifestyle&type=jackets">Jackets</a>
      <a href="product.html?sport=lifestyle&type=joggers">Joggers</a>
      <a href="product.html?sport=lifestyle&type=tshirts">T-Shirts</a>
    </div>
  </div>

</div>

<!-- HERO -->
<section class="hero">
  <h1>MEN COLLECTION</h1>
</section>

<div class="grid" id="grid"></div>

<script src="products.js"></script>

<script>

function goHome(){
  window.location.href="../index.html";
}

function goCart(){
  window.location.href="../cart.html";
}

/* CART COUNT */
function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("count").innerText = cart.length;
}

updateCart();

</script>

</body>
</html>
