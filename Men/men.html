<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h1 {
  font-size: 42px;
}

.hero-content p {
  opacity: 0.8;
}

/* ===================== */
/* DROPDOWN NAV (NEW UX) */
/* ===================== */

.nav-wrap {
  display: flex;
  gap: 18px;
  padding: 25px 8%;
  flex-wrap: wrap;
}

.dropdown {
  position: relative;
}

.dropbtn {
  padding: 10px 18px;
  border: 1px solid #333;
  background: transparent;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: 500;
}

.dropbtn:hover {
  background: #c200ff;
  border-color: #c200ff;
}

/* dropdown menu */
.dropdown-content {
  position: absolute;
  top: 48px;
  left: 0;
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  overflow: hidden;
  min-width: 180px;

  max-height: 0;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s ease;
  pointer-events: none;
  z-index: 999;
}

/* active dropdown */
.dropdown.active .dropdown-content {
  max-height: 300px;
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.dropdown-content div {
  padding: 12px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
  border-bottom: 1px solid #1f1f1f;
}

.dropdown-content div:hover {
  background: #1a1a1a;
  color: #c200ff;
}

/* PRODUCTS */
.products {
  padding: 30px 8%;
}

.section-title {
  font-size: 18px;
  margin: 40px 0 20px;
  border-left: 3px solid white;
  padding-left: 10px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 30px;
}

/* CARD */
.product-card {
  background: #111;
  padding: 18px;
  border: 1px solid #1e1e1e;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
}

.product-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  background: #0a0a0a;
}

select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #000;
  color: white;
  border: 1px solid #333;
}

.add-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  color: white;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:768px){
.hero-content h1 { font-size: 26px; }
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
    <p>Performance engineered for modern movement</p>
  </div>
</section>

<!-- ===================== -->
<!-- DROPDOWN NAV -->
<!-- ===================== -->

<div class="nav-wrap">

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDrop(this)">Football</button>
    <div class="dropdown-content">
      <div onclick="scrollToSection('football')">All Football</div>
    </div>
  </div>

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDrop(this)">Basketball</button>
    <div class="dropdown-content">
      <div onclick="scrollToSection('basketball')">All Basketball</div>
    </div>
  </div>

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDrop(this)">Handball</button>
    <div class="dropdown-content">
      <div onclick="scrollToSection('handball')">All Handball</div>
    </div>
  </div>

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDrop(this)">Training</button>
    <div class="dropdown-content">
      <div onclick="scrollToSection('training')">All Training</div>
    </div>
  </div>

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDrop(this)">Lifestyle</button>
    <div class="dropdown-content">
      <div onclick="scrollToSection('lifestyle')">All Lifestyle</div>
    </div>
  </div>

</div>

<!-- ===================== -->
<!-- SAME SECTIONS (UNCHANGED) -->
<!-- ===================== -->

<section class="products" id="football">
  <div class="section-title">Football</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/football1.jpg">
      <h3>Elite Football Kit</h3>
      <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
      <button class="add-btn" onclick="addToCart('FB1', this)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="../Men_Images/football2.jpg">
      <h3>Strike Pro Kit</h3>
      <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
      <button class="add-btn" onclick="addToCart('FB2', this)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="../Men_Images/football3.jpg">
      <h3>Velocity Kit</h3>
      <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
      <button class="add-btn" onclick="addToCart('FB3', this)">Add to Cart</button>
    </div>

  </div>
</section>

<section class="products" id="basketball">
  <div class="section-title">Basketball</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/bb1.jpg">
      <h3>Hoops Kit Black</h3>
      <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
      <button class="add-btn" onclick="addToCart('BB1', this)">Add to Cart</button>
    </div>

  </div>
</section>

<section class="products" id="handball">
  <div class="section-title">Handball</div>
  <div class="product-grid">

    <div class="product-card">
      <img src="../Men_Images/hb1.jpg">
      <h3>Speed Handball Kit</h3>
      <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
      <button class="add-btn" onclick="addToCart('HB1', this)">Add to Cart</button>
    </div>

  </div>
</section>

<section class="products" id="training">
  <div class="section-title">Training</div>
</section>

<section class="products" id="lifestyle">
  <div class="section-title">Lifestyle</div>
</section>

<script>

function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

/* dropdown logic (AUTO CLOSE OTHERS) */
function toggleDrop(btn){
  let parent = btn.parentElement;

  document.querySelectorAll(".dropdown").forEach(d=>{
    if(d !== parent) d.classList.remove("active");
  });

  parent.classList.toggle("active");
}

/* CART */
function addToCart(id, btn){
  let card = btn.closest(".product-card");
  let size = card.querySelector("select").value;

  if(!size || size === "Select Size"){
    alert("Select size first");
    return;
  }

  let img = card.querySelector("img").src;
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({id,size,image:img,quantity:1});
  localStorage.setItem("cart", JSON.stringify(cart));

  updateCartCount();
}

function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

updateCartCount();

</script>

</body>
</html>
