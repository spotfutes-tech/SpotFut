<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h1 {
  font-size: 42px;
}

.hero-content p {
  opacity: 0.8;
}

/* CATEGORY NAV */
.categories {
  padding: 25px 8%;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.cat-btn {
  padding: 8px 16px;
  border: 1px solid #333;
  background: transparent;
  color: white;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.cat-btn:hover {
  background: #c200ff;
  border-color: #c200ff;
}

/* =========================
   ACCORDION (NEW PREMIUM UX)
========================= */

.accordion {
  padding: 10px 8% 40px;
}

.accordion-item {
  border: 1px solid #1e1e1e;
  margin-bottom: 12px;
  border-radius: 10px;
  overflow: hidden;
}

.accordion-header {
  padding: 16px;
  background: #111;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}

.accordion-header:hover {
  background: #1a1a1a;
}

.accordion-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  background: #0a0a0a;
}

/* INNER GRID */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 20px;
  padding: 20px;
}

/* CARD */
.product-card {
  background: #111;
  padding: 18px;
  border: 1px solid #1e1e1e;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
}

/* IMAGE */
.product-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  background: #0a0a0a;
}

/* SIZE */
select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #000;
  color: white;
  border: 1px solid #333;
}

/* BUTTON */
.add-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  color: white;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:768px){
.hero-content h1 { font-size: 26px; }
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
    <p>Built for every sport. Designed for performance.</p>
  </div>
</section>

<!-- CATEGORY NAV -->
<div class="categories">
  <button class="cat-btn" onclick="toggleAccordion('football')">Football</button>
  <button class="cat-btn" onclick="toggleAccordion('basketball')">Basketball</button>
  <button class="cat-btn" onclick="toggleAccordion('handball')">Handball</button>
  <button class="cat-btn" onclick="toggleAccordion('training')">Training</button>
  <button class="cat-btn" onclick="toggleAccordion('lifestyle')">Lifestyle</button>
</div>

<!-- ACCORDION WRAPPER -->
<div class="accordion">

<!-- FOOTBALL -->
<div class="accordion-item" id="football">
  <div class="accordion-header" onclick="openAccordion('football')">
    Football <span>+</span>
  </div>

  <div class="accordion-content">
    <div class="product-grid">

      <div class="product-card">
        <img src="../Men_Images/football1.jpg">
        <h3>Elite Football Kit</h3>
        <select>
          <option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
        </select>
        <button class="add-btn" onclick="addToCart('FB1', this)">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="../Men_Images/football2.jpg">
        <h3>Strike Pro Kit</h3>
        <select>
          <option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
        </select>
        <button class="add-btn" onclick="addToCart('FB2', this)">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="../Men_Images/football3.jpg">
        <h3>Velocity Kit</h3>
        <select>
          <option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
        </select>
        <button class="add-btn" onclick="addToCart('FB3', this)">Add to Cart</button>
      </div>

    </div>
  </div>
</div>

<!-- BASKETBALL -->
<div class="accordion-item" id="basketball">
  <div class="accordion-header" onclick="openAccordion('basketball')">
    Basketball <span>+</span>
  </div>

  <div class="accordion-content">
    <div class="product-grid">

      <div class="product-card">
        <img src="../Men_Images/bb1.jpg">
        <h3>Hoops Kit Black</h3>
        <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <button class="add-btn" onclick="addToCart('BB1', this)">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="../Men_Images/bb2.jpg">
        <h3>Street Dunk Kit</h3>
        <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <button class="add-btn" onclick="addToCart('BB2', this)">Add to Cart</button>
      </div>

    </div>
  </div>
</div>

<!-- HANDBALL -->
<div class="accordion-item" id="handball">
  <div class="accordion-header" onclick="openAccordion('handball')">
    Handball <span>+</span>
  </div>

  <div class="accordion-content">
    <div class="product-grid">

      <div class="product-card">
        <img src="../Men_Images/hb1.jpg">
        <h3>Speed Kit</h3>
        <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <button class="add-btn" onclick="addToCart('HB1', this)">Add to Cart</button>
      </div>

    </div>
  </div>
</div>

<!-- TRAINING -->
<div class="accordion-item" id="training">
  <div class="accordion-header" onclick="openAccordion('training')">
    Training <span>+</span>
  </div>

  <div class="accordion-content">
    <div class="product-grid">

      <div class="product-card">
        <img src="../Men_Images/tr1.jpg">
        <h3>Training Set Black</h3>
        <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <button class="add-btn" onclick="addToCart('TR1', this)">Add to Cart</button>
      </div>

    </div>
  </div>
</div>

<!-- LIFESTYLE -->
<div class="accordion-item" id="lifestyle">
  <div class="accordion-header" onclick="openAccordion('lifestyle')">
    Lifestyle <span>+</span>
  </div>

  <div class="accordion-content">
    <div class="product-grid">

      <div class="product-card">
        <img src="../Men_Images/ls1.jpg">
        <h3>Urban Hoodie</h3>
        <select><option>Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <button class="add-btn" onclick="addToCart('LS1', this)">Add to Cart</button>
      </div>

    </div>
  </div>
</div>

</div>

<script>

/* CART */
function addToCart(id, btn){
  let card = btn.closest(".product-card");
  let size = card.querySelector("select").value;

  if(!size || size === "Select Size"){
    alert("Select size first");
    return;
  }

  let img = card.querySelector("img").src;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({ id, size, image: img, quantity: 1 });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

updateCartCount();

function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

/* ACCORDION LOGIC (AUTO CLOSE OTHERS + SMOOTH 300ms) */
function openAccordion(id){

  document.querySelectorAll(".accordion-content").forEach(el=>{
    if(el.parentElement.id !== id){
      el.style.maxHeight = null;
    }
  });

  let item = document.querySelector("#"+id+" .accordion-content");

  if(item.style.maxHeight){
    item.style.maxHeight = null;
  } else {
    item.style.maxHeight = item.scrollHeight + "px";
  }
}

/* optional nav scroll helper */
function toggleAccordion(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
  setTimeout(()=>openAccordion(id),300);
}

</script>

</body>
</html>
