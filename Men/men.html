.nav{
  display:flex;

}

.nav-item{
  position:relative;
  cursor:pointer;
}

.nav-item:hover{

}

.dropdown{
  position:absolute;
  top:100%;
  left:0;
  background:#111;
  min-width:180px;
  border:1px solid #222;

  opacity:0;
  visibility:hidden;
}

.nav-item:hover .dropdown{
  opacity:1;
  visibility:visible;
}

.dropdown a{
  display:block;
  padding:10px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#1a1a1a;
  color:#c200ff;

.hero{
