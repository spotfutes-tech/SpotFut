<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotFut | Men</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 8%;
  border-bottom: 1px solid #1e1e1e;
  position: sticky;
  top: 0;
  background: #0a0a0a;
  z-index: 1000;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

.cart {
  cursor: pointer;
}

#cart-count {
  background: white;
  color: black;
  padding: 3px 8px;
  border-radius: 50%;
  font-size: 12px;
  margin-left: 6px;
}

/* HERO */
.hero {
  height: 45vh;
  background: url('../Images/Men.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

.hero::after {
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h1 {
  font-size: 42px;
}

.hero-content p {
  opacity: 0.8;
}

/* SPORTS WRAPPER */
.sport {
  margin: 25px 8%;
  border: 1px solid #1f1f1f;
  border-radius: 14px;
  overflow: hidden;
  background: #0c0c0c;
}

/* SPORT HEADER */
.sport-header {
  padding: 18px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111;
  transition: 0.3s;
}

.sport-header:hover {
  background: #1a1a1a;
}

.sport-header h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 1px;
}

/* SPORT CONTENT */
.sport-content {
  display: none;
  padding: 20px;
}

/* CATEGORY CARDS */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
  gap: 12px;
  margin-bottom: 25px;
}

.category-card {
  padding: 18px;
  text-align: center;
  background: #111;
  border: 1px solid #1f1f1f;
  cursor: pointer;
  transition: 0.3s;
  border-radius: 12px;
}

.category-card:hover {
  transform: translateY(-4px);
  background: #1a1a1a;
  border-color: #c200ff;
}

/* PRODUCTS */
.products {
  padding: 10px 0 30px;
}

.section-title {
  font-size: 16px;
  margin: 20px 0 15px;
  border-left: 3px solid white;
  padding-left: 10px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 30px;
}

/* CARD */
.product-card {
  background: #111;
  padding: 18px;
  border: 1px solid #1e1e1e;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
  border-color: #c200ff;
}

/* IMAGE */
.product-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  background: #0a0a0a;
}

/* SIZE */
select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #000;
  color: white;
  border: 1px solid #333;
}

/* BUTTON */
.add-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: linear-gradient(45deg,#6a00ff,#ff00cc);
  border: none;
  color: white;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:768px){
.hero-content h1 { font-size: 26px; }
.category-grid { grid-template-columns: repeat(2,1fr); }
}

</style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">← SPOTFUT</div>
  <div class="cart" onclick="goToCart()">🛒 <span id="cart-count">0</span></div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>MEN COLLECTION</h1>
    <p>Built for every sport. Designed for performance.</p>
  </div>
</section>

<!-- ================= FOOTBALL ================= -->
<div class="sport">

  <div class="sport-header" onclick="toggleSport(this)">
    <h2>Football</h2>
    <span>+</span>
  </div>

  <div class="sport-content">

    <div class="category-grid">
      <div class="category-card" onclick="scrollToSection('football-kits')">Kits</div>
      <div class="category-card" onclick="scrollToSection('football-tracksuits')">Tracksuits</div>
      <div class="category-card" onclick="scrollToSection('football-hoodies')">Hoodies</div>
      <div class="category-card" onclick="scrollToSection('football-jackets')">Jackets</div>
    </div>

  </div>
</div>

<!-- ================= BASKETBALL ================= -->
<div class="sport">

  <div class="sport-header" onclick="toggleSport(this)">
    <h2>Basketball</h2>
    <span>+</span>
  </div>

  <div class="sport-content">

    <div class="category-grid">
      <div class="category-card" onclick="scrollToSection('basketball-kits')">Kits</div>
      <div class="category-card" onclick="scrollToSection('basketball-hoodies')">Hoodies</div>
      <div class="category-card" onclick="scrollToSection('basketball-shorts')">Shorts</div>
    </div>

  </div>
</div>

<!-- ================= HANDBALL ================= -->
<div class="sport">

  <div class="sport-header" onclick="toggleSport(this)">
    <h2>Handball</h2>
    <span>+</span>
  </div>

  <div class="sport-content">

    <div class="category-grid">
      <div class="category-card" onclick="scrollToSection('handball-kits')">Kits</div>
      <div class="category-card" onclick="scrollToSection('handball-tracksuits')">Tracksuits</div>
      <div class="category-card" onclick="scrollToSection('handball-hoodies')">Hoodies</div>
    </div>

  </div>
</div>

<!-- ================= TRAINING ================= -->
<div class="sport">

  <div class="sport-header" onclick="toggleSport(this)">
    <h2>Training</h2>
    <span>+</span>
  </div>

  <div class="sport-content">
    <p style="opacity:0.7">Training wear collections coming soon.</p>
  </div>
</div>

<!-- ================= LIFESTYLE ================= -->
<div class="sport">

  <div class="sport-header" onclick="toggleSport(this)">
    <h2>Lifestyle</h2>
    <span>+</span>
  </div>

  <div class="sport-content">
    <p style="opacity:0.7">Streetwear drops coming soon.</p>
  </div>
</div>

<script>

/* NAV */
function goHome(){
  window.location.href="../index.html";
}

function goToCart(){
  window.location.href="../cart.html";
}

/* SMOOTH SCROLL */
function scrollToSection(id){
  document.getElementById(id)?.scrollIntoView({behavior:"smooth"});
}

/* ACCORDION (AUTO CLOSE OTHERS) */
function toggleSport(el){

  let all = document.querySelectorAll(".sport-content");
  let panels = document.querySelectorAll(".sport-header span");

  let content = el.nextElementSibling;
  let icon = el.querySelector("span");

  all.forEach(c => {
    if(c !== content) c.style.display = "none";
  });

  panels.forEach(i => {
    if(i !== icon) i.innerText = "+";
  });

  if(content.style.display === "block"){
    content.style.display = "none";
    icon.innerText = "+";
  } else {
    content.style.display = "block";
    icon.innerText = "−";
  }
}

/* CART */
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

updateCartCount();

</script>

</body>
</html>
