<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varsity Bomber Jackets | SpotFut</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:'Poppins', sans-serif;
}

/* NAV */
nav{
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:500;
}

.cart-icon{
    cursor:pointer;
}

#cart-count{
    background:#c200ff;
    padding:2px 8px;
    border-radius:20px;
    font-size:12px;
}

/* TITLE */
h1{
    font-family:'Playfair Display', serif;
    font-size:3rem;
}

/* GRID */
.jacket-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
    gap:40px;
}

/* CARD */
.jacket-card{
    background:#111;
    padding:20px;
    border:1px solid #1e1e1e;
    transition:0.4s ease;
}

.jacket-card:hover{
    border-color:#444;
    transform:translateY(-8px);
}

/* SLIDER */
.image-slider{
    position:relative;
    width:100%;
    height:350px;
    overflow:hidden;
    margin-bottom:20px;
}

.image-slider img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.image-slider img.active{
    display:block;
}

.slider-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    font-size:22px;
    padding:8px 14px;
    cursor:pointer;
}

.prev{ left:10px; }
.next{ right:10px; }

/* EDITION COLORS */
.edition{
    font-weight:600;
    margin-bottom:10px;
}

.black{ color:#e5e5e5; }
.green{ color:#3aa76d; }
.blue{ color:#4169e1; }
.latte{ color:#d6c6a5; }
.solar{ color:#f4c430; }
.sky{ color:#87ceeb; }

.jacket-card p{
    color:#aaa;
}

/* ADD BUTTON */
.add-section{
    margin-top:20px;
}

.add-btn{
    width:100%;
    padding:12px;
    background:transparent;
    border:1px solid #c200ff;
    color:#c200ff;
    cursor:pointer;
    transition:0.3s;
}

.add-btn:hover{
    background:#c200ff;
    color:black;
}

/* SIZE DROPDOWN */
.size-dropdown{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.4s ease;
}

.size-dropdown.open{
    max-height:200px;
    margin-top:15px;
}

.sizes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.sizes span{
    padding:8px 14px;
    border:1px solid #333;
    cursor:pointer;
    transition:0.3s;
}

.sizes span:hover{
    border-color:#c200ff;
    color:#c200ff;
}

.sizes span.active{
    background:#c200ff;
    color:black;
    border-color:#c200ff;
}

/* CART DRAWER */
.cart-drawer{
    position:fixed;
    top:0;
    right:-400px;
    width:350px;
    height:100%;
    background:#111;
    border-left:1px solid #333;
    transition:0.4s ease;
    padding:20px;
    z-index:1000;
}

.cart-drawer.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.cart-items{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.cart-item{
    border-bottom:1px solid #222;
    padding-bottom:10px;
    font-size:14px;
}
</style>
</head>

<body>

<nav>
    <a href="../index.html">← Back to Home</a>
    <div class="cart-icon">🛒 <span id="cart-count">0</span></div>
</nav>

<section style="padding:80px 8%; text-align:center;">
    <h1>Varsity Bomber Jackets</h1>
</section>

<section style="padding:40px 8%;">

<div class="jacket-grid">

<!-- JACKET TEMPLATE -->
<div class="jacket-card" data-name="Black Edition">
    <div class="image-slider">
        <img src="varsity-KW.jpg" class="active">
        <img src="varsity-KW-detail-1.jpg">
        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>
    </div>
    <h3 class="edition black">Black Edition</h3>
    <p>Deep matte black body with sharp contrast sleeves.</p>
    <div class="add-section">
        <button class="add-btn">ADD TO CART</button>
        <div class="size-dropdown">
            <div class="sizes">
                <span>XS</span><span>S</span><span>M</span><span>L</span><span>XL</span>
            </div>
        </div>
    </div>
</div>

<div class="jacket-card" data-name="Green Edition">
    <img src="varsity-GW.jpg" style="width:100%; height:350px; object-fit:cover; margin-bottom:20px;">
    <h3 class="edition green">Green Edition</h3>
    <p>Heritage varsity tones redefined.</p>
    <div class="add-section">
        <button class="add-btn">ADD TO CART</button>
        <div class="size-dropdown">
            <div class="sizes">
                <span>XS</span><span>S</span><span>M</span><span>L</span><span>XL</span>
            </div>
        </div>
    </div>
</div>

</div>
</section>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
        <h3>Your Cart</h3>
        <span id="close-cart" style="cursor:pointer;">✕</span>
    </div>
    <div class="cart-items" id="cart-items"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

let cart = [];

/* SLIDERS */
document.querySelectorAll(".image-slider").forEach(slider => {
    const images = slider.querySelectorAll("img");
    const nextBtn = slider.querySelector(".next");
    const prevBtn = slider.querySelector(".prev");
    let index = 0;

    function showImage(i){
        images.forEach(img => img.classList.remove("active"));
        images[i].classList.add("active");
    }

    if(nextBtn){
        nextBtn.addEventListener("click", () => {
            index = (index + 1) % images.length;
            showImage(index);
        });

        prevBtn.addEventListener("click", () => {
            index = (index - 1 + images.length) % images.length;
            showImage(index);
        });
    }
});

/* SIZE DROPDOWN */
document.querySelectorAll(".add-btn").forEach(button => {
    button.addEventListener("click", function(){
        const dropdown = this.nextElementSibling;
        document.querySelectorAll(".size-dropdown").forEach(d => {
            if(d !== dropdown) d.classList.remove("open");
        });
        dropdown.classList.toggle("open");
    });
});

/* ADD TO CART */
document.querySelectorAll(".sizes span").forEach(size => {
    size.addEventListener("click", function(){

        const card = this.closest(".jacket-card");
        const name = card.dataset.name;
        const selectedSize = this.textContent;

        const existing = cart.find(item => item.name === name && item.size === selectedSize);

        if(existing){
            existing.quantity += 1;
        } else {
            cart.push({ name, size:selectedSize, quantity:1 });
        }

        updateCartUI();
        document.getElementById("cart-drawer").classList.add("open");
    });
});

function updateCartUI(){
    const cartItems = document.getElementById("cart-items");
    const cartCount = document.getElementById("cart-count");
    cartItems.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
        total += item.quantity;
        cartItems.innerHTML += `
            <div class="cart-item">
                <strong>${item.name}</strong><br>
                Size: ${item.size}<br>
                Qty: ${item.quantity}
            </div>
        `;
    });

    cartCount.textContent = total;
}

document.getElementById("close-cart").addEventListener("click", function(){
    document.getElementById("cart-drawer").classList.remove("open");
});

document.querySelector(".cart-icon").addEventListener("click", function(){
    document.getElementById("cart-drawer").classList.add("open");
});

});
</script>

</body>
</html>
