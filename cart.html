<script>

/* PRODUCT DATABASE (SAME AS JACKETS PAGE) */
const PRODUCTS = {
  "varsity-black": { name: "Varsity Black Edition", price: 59 },
  "varsity-green": { name: "Varsity Green Edition", price: 59 },
  "varsity-blue": { name: "Varsity Royal Blue Edition", price: 59 },
  "varsity-latte": { name: "Varsity Latte Edition", price: 59 },
  "varsity-solar": { name: "Varsity Solar Edition", price: 59 },
  "varsity-sky": { name: "Varsity Sky Edition", price: 59 }
};

function loadCart(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let container = document.getElementById("cart-items");
  let total = 0;

  container.innerHTML = "";

  if(cart.length === 0){
    container.innerHTML = "<p>Your cart is empty.</p>";
    return;
  }

  cart.forEach((item, index)=>{

    let product = PRODUCTS[item.id];
    total += product.price;

    container.innerHTML += `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:15px;">
        <div>
          <strong>${product.name}</strong><br>
          Size: ${item.size}<br>
          €${product.price}
        </div>
        <button onclick="removeItem(${index})"
          style="background:none; border:1px solid #444; color:white; padding:6px 12px; cursor:pointer;">
          Remove
        </button>
      </div>
    `;
  });

  document.getElementById("cart-total").innerText = "Total: €" + total;
}

function removeItem(index){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

loadCart();

</script>
