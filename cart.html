<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | SpotFut</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:'Poppins', sans-serif;
    padding:60px 8%;
}

h1{
    font-family:'Playfair Display', serif;
    margin-bottom:40px;
}

a{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:30px;
}

/* CART ITEM */
.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
    padding:20px 0;
    gap:20px;
}

/* LEFT SIDE */
.cart-left{
    display:flex;
    align-items:center;
    gap:18px;
}

/* PRODUCT IMAGE */
.cart-img{
    width:70px;
    height:90px;
    object-fit:contain;
    background:#111;
    border:1px solid #222;
}

/* PRODUCT INFO */
.cart-info{
    line-height:1.6;
}

/* RIGHT SIDE */
.cart-right{
    display:flex;
    align-items:center;
    gap:15px;
}

/* Quantity Stepper */
.qty-box{
    display:flex;
    align-items:center;
    border:1px solid #333;
    padding:6px 12px;
    gap:14px;
}

.qty-box button{
    background:none;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* Remove Button */
.remove-btn{
    background:none;
    border:1px solid #444;
    color:white;
    padding:6px 12px;
    cursor:pointer;
}

/* Total */
.total{
    margin-top:40px;
    font-size:1.2rem;
}

/* Trust Box */
.trust-box{
    margin-top:30px;
    font-size:0.9rem;
    opacity:0.8;
    line-height:1.8;
}

/* Checkout Button */
.checkout-btn{
    margin-top:40px;
    width:100%;
    padding:16px;
    background:white;
    color:black;
    border:none;
    font-weight:600;
    cursor:pointer;
}

.checkout-btn:hover{
    opacity:0.8;
}

.note{
    margin-top:10px;
    font-size:0.85rem;
    opacity:0.7;
}

</style>
</head>

<body>

<a href="index.html">← Back to Home</a>

<h1>Your Cart</h1>

<div id="cart-items"></div>

<h3 id="cart-total" class="total"></h3>

<!-- TRUST SECTION -->
<div class="trust-box">
✔ Secure Order Handling<br>
✔ Custom Kit Personalization Available<br>
✔ Direct WhatsApp Support
</div>

<!-- BUTTON -->
<button class="checkout-btn" onclick="goToCheckout()">
Place Order
</button>

<!-- <p class="note">
Our team will confirm your order and provide payment options via WhatsApp or Email.
</p>-->

<!-- PRODUCTS DATABASE -->
<script src="products.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function(){
    loadCart();
});

/* LOAD CART */
function loadCart(){

    if(typeof PRODUCTS === "undefined"){
        console.error("PRODUCTS not loaded. Check products.js path.");
        return;
    }

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart-items");
    let total = 0;

    container.innerHTML = "";

    if(cart.length === 0){
        container.innerHTML = `
        <p>Your cart is empty.</p>
        <a href="index.html">Continue Shopping →</a>
        `;
        document.getElementById("cart-total").innerText = "";
        return;
    }

    cart.forEach((item, index)=>{

        let product = PRODUCTS[item.id];
        if(!product) return;

        let quantity = item.quantity || 1;

        total += product.price * quantity;

        container.innerHTML += `
        <div class="cart-item">

            <!-- LEFT -->
            <div class="cart-left">

                <img src="${item.image}" class="cart-img">

                <div class="cart-info">
                    <strong>${product.name}</strong><br>
                    Size: ${item.size}<br>
                    Quantity: ${quantity}<br>
                    €${product.price}
                </div>

            </div>

            <!-- RIGHT -->
            <div class="cart-right">

                <div class="qty-box">
                    <button onclick="changeQuantity(${index}, -1)">−</button>
                    <span>${quantity}</span>
                    <button onclick="changeQuantity(${index}, 1)">+</button>
                </div>

                <button class="remove-btn" onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        </div>
        `;
    });

    document.getElementById("cart-total").innerText = "Total: €" + total;
}

/* CHANGE QUANTITY */
function changeQuantity(index, change){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(!cart[index]) return;

    cart[index].quantity = (cart[index].quantity || 1) + change;

    if(cart[index].quantity < 1){
        cart.splice(index,1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

/* REMOVE ITEM */
function removeItem(index){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index,1);

    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

/* CHECKOUT */
function goToCheckout(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length === 0){
        alert("Your cart is empty.");
        return;
    }

    window.location.href = "checkout.html";
}

</script>

</body>
</html>
