<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpotFut Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    padding:18px 8%;
    border-bottom:1px solid #eee;
}

.back,.cart{cursor:pointer}

/* LAYOUT */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.product-detail {
    display: flex;
    gap: 50px;
    flex-wrap: wrap;
}

/* IMAGES */
.images {
    flex: 1;
    min-width: 300px;
}

.images img {
    width: 100%;
    border-radius: 10px;
    cursor: zoom-in;
}

.thumbs {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.thumbs img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid transparent;
}

.thumbs img:hover {
    border: 2px solid #000;
}

/* INFO */
.info {
    flex: 1;
    min-width: 300px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.description {
    margin-top: 10px;
    line-height: 1.6;
    color: #444;
}

/* SIZES */
#sizes button {
    padding: 10px 15px;
    margin: 5px 5px 0 0;
    border: 1px solid #000;
    background: white;
    cursor: pointer;
    border-radius: 6px;
}

/* ADD BUTTON */
.cartBtn {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal img {
    max-width: 90%;
    max-height: 90%;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="back" onclick="history.back()">← Back</div>
  <div class="cart" onclick="goCart()">🛒 <span id="count">0</span></div>
</div>

<div class="container">
    <div class="product-detail">

        <div class="images">
            <img id="mainImg">
            <div class="thumbs" id="thumbs"></div>
        </div>

        <div class="info">
            <h1 id="name"></h1>
            <div class="price" id="price"></div>

            <p id="description" class="description"></p>

            <div id="sizes"></div>

            <button class="cartBtn" onclick="addToCart()">Add to Cart</button>
        </div>

    </div>
</div>

<div class="modal" id="imgModal" onclick="closeModal()">
    <img id="modalImg">
</div>

<script src="products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

const product = PRODUCTS[productId];

if (!product) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>Product not found</h2>";
}

/* ================= BASIC ================= */
document.getElementById("name").innerText = product.name;
document.getElementById("price").innerText = "€" + product.price;

/* ================= DESCRIPTION ================= */
const GENERIC_DESCRIPTION =
`Premium quality sportswear engineered for performance and comfort.
Breathable fabric, athletic fit, and durable stitching designed for everyday play.`;

// Category-based descriptions
const CATEGORY_DESCRIPTIONS = {
    soccer: `Elite performance football kit designed for speed, comfort, and durability.
Lightweight breathable fabric with pro-level fit.`
};

let finalDescription =
    product.description ||
    (productId.startsWith("SF-SJM") ? CATEGORY_DESCRIPTIONS.soccer : null) ||
    GENERIC_DESCRIPTION;

document.getElementById("description").innerHTML =
    finalDescription.replace(/\n/g, "<br>");

/* ================= IMAGES ================= */
const mainImg = document.getElementById("mainImg");
mainImg.src = product.img?.[0] || "";

mainImg.onclick = () => openModal(mainImg.src);

const thumbs = document.getElementById("thumbs");

(product.img || []).forEach(img => {
    thumbs.innerHTML += `<img src="${img}" onclick="changeImg('${img}')">`;
});

function changeImg(src){
    mainImg.src = src;
}

/* ================= SIZES ================= */
let selectedSize = null;

const sizesDiv = document.getElementById("sizes");

// Category sizes
const CATEGORY_SIZES = {
    soccer: ["3XS","2XS","XS","S","M","L","XL","2XL","3XL"]
};

// Default sizes
const DEFAULT_SIZES = ["S","M","L","XL"];

// Final logic
let sizesToUse =
    (product.sizes && Array.isArray(product.sizes))
    ? product.sizes
    : (productId.startsWith("SF-SJM") ? CATEGORY_SIZES.soccer : DEFAULT_SIZES);

// Render
sizesToUse.forEach(size => {
    const btn = document.createElement("button");
    btn.innerText = size;

    btn.onclick = () => {
        selectedSize = size;

        document.querySelectorAll("#sizes button").forEach(b => {
            b.style.background = "";
            b.style.color = "";
        });

        btn.style.background = "black";
        btn.style.color = "white";
    };

    sizesDiv.appendChild(btn);
});

/* ================= CART ================= */
function addToCart(){

    if (!selectedSize) {
        alert("Please select size");
        return;
    }

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        id: productId,
        name: product.name,
        price: product.price,
        size: selectedSize,
        image: product.img?.[0] || "",
        quantity: 1
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    updateCart();
    alert("Added to cart!");
}

/* ================= CART COUNT ================= */
function updateCart(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("count").innerText = cart.length;
}

function goCart(){
    window.location.href = "../cart.html";
}

/* ================= MODAL ================= */
function openModal(src){
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeModal(){
    document.getElementById("imgModal").style.display = "none";
}

updateCart();

</script>

</body>
</html>
