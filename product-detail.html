<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpotFut Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.product-detail {
    display: flex;
    gap: 50px;
    flex-wrap: wrap;
}

/* IMAGES */
.images {
    flex: 1;
    min-width: 300px;
}

.images img {
    width: 100%;
    border-radius: 10px;
    cursor: zoom-in;
}

.thumbs {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.thumbs img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid transparent;
}

.thumbs img:hover {
    border: 2px solid #000;
}

/* INFO */
.info {
    flex: 1;
    min-width: 300px;
}

.info h1 {
    margin-bottom: 10px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.description {
    margin-top: 10px;
    line-height: 1.6;
    color: #444;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal img {
    max-width: 90%;
    max-height: 90%;
}
</style>
</head>

<body>

<div class="container">
    <div class="product-detail">

        <!-- IMAGES -->
        <div class="images">
            <img id="mainImg">
            <div class="thumbs" id="thumbs"></div>
        </div>

        <!-- INFO -->
        <div class="info">
            <h1 id="name"></h1>
            <div class="price" id="price"></div>
            <p class="description" id="description"></p>
        </div>

    </div>
</div>

<!-- MODAL -->
<div class="modal" id="imgModal" onclick="closeModal()">
    <img id="modalImg">
</div>

<!-- IMPORTANT: correct path if needed -->
<script src="product.js"></script>

<script>
/* ================= GET ID ================= */
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

/* ================= SAFETY CHECK ================= */
if (!productId || !PRODUCTS[productId]) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>Product not found</h2>";
    throw new Error("Invalid product ID");
}

const product = PRODUCTS[productId];

/* ================= BASIC INFO ================= */
document.getElementById("name").innerText = product.name || "No name";
document.getElementById("price").innerText = "$" + (product.price || 0);

/* ================= DESCRIPTION ================= */
document.getElementById("description").innerHTML =
    (product.description || "No description available").replace(/\n/g, "<br>");

/* ================= IMAGES SAFE ================= */
const images = Array.isArray(product.img) ? product.img : [];

if (images.length === 0) {
    images.push("https://via.placeholder.com/600x800?text=No+Image");
}

/* MAIN IMAGE */
const mainImg = document.getElementById("mainImg");
mainImg.src = images[0];
mainImg.onclick = () => openModal(mainImg.src);

/* THUMBNAILS */
const thumbs = document.getElementById("thumbs");
thumbs.innerHTML = "";

images.forEach(img => {
    const el = document.createElement("img");
    el.src = img;
    el.onclick = () => mainImg.src = img;
    thumbs.appendChild(el);
});

/* ================= MODAL ================= */
function openModal(src) {
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeModal() {
    document.getElementById("imgModal").style.display = "none";
}
</script>

</body>
</html>
