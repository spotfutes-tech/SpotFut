<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpotFut Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Basic Styling -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .product-detail {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
        }

        /* LEFT SIDE (IMAGES) */
        .images {
            flex: 1;
            min-width: 300px;
        }

        .images img {
            width: 100%;
            border-radius: 10px;
        }

        #mainImg {
            cursor: zoom-in;
        }

        .thumbs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .thumbs img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid transparent;
        }

        .thumbs img:hover {
            border: 2px solid #000;
        }

        /* RIGHT SIDE (INFO) */
        .info {
            flex: 1;
            min-width: 300px;
        }

        .info h1 {
            margin: 0 0 10px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .sizes {
            margin-bottom: 20px;
        }

        .sizes button {
            padding: 10px 15px;
            margin: 5px;
            border: 1px solid #000;
            background: white;
            cursor: pointer;
            border-radius: 6px;
        }

        .sizes button.active {
            background: black;
            color: white;
        }

        /* MODAL ZOOM */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="container">
    <div class="product-detail">

        <!-- IMAGES -->
        <div class="images">
            <img id="mainImg">
            <div class="thumbs" id="thumbs"></div>
        </div>

        <!-- INFO -->
        <div class="info">
            <h1 id="name"></h1>
            <div class="price" id="price"></div>

            <div class="sizes" id="sizes"></div>
        </div>

    </div>
</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imgModal" onclick="closeModal()">
    <img id="modalImg">
</div>

<!-- LOAD PRODUCT DATA -->
<script src="product.js"></script>

<script>
/* ===============================
   GET PRODUCT ID FROM URL
=============================== */
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

const product = PRODUCTS[productId];

if (!product) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>Product not found</h2>";
}

/* ===============================
   RENDER PRODUCT
=============================== */
document.getElementById("name").innerText = product.name;
document.getElementById("price").innerText = "$" + product.price;

/* MAIN IMAGE */
const mainImg = document.getElementById("mainImg");
mainImg.src = product.img[0];

/* CLICK TO ZOOM */
mainImg.onclick = () => openModal(mainImg.src);

/* THUMBNAILS */
const thumbs = document.getElementById("thumbs");

product.img.forEach(img => {
    thumbs.innerHTML += `
        <img src="${img}" onclick="changeImg('${img}')">
    `;
});

function changeImg(src) {
    mainImg.src = src;
}

/* SIZES */
const sizesDiv = document.getElementById("sizes");

if (product.sizes) {
    product.sizes.forEach(size => {
        sizesDiv.innerHTML += `<button onclick="selectSize(this)">${size}</button>`;
    });
}

function selectSize(btn) {
    document.querySelectorAll(".sizes button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

/* MODAL */
function openModal(src) {
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeModal() {
    document.getElementById("imgModal").style.display = "none";
}
</script>

</body>
</html>
